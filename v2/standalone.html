  <style>
:root {
  --cb-paper:#f4f0e8; --cb-light:#fcfaf6; --cb-ink:#151515;
  --cb-muted:#625f59; --cb-red:#d71920; --cb-deep:#b30d15;
  --cb-white:#fffefb; --cb-rule:rgba(21,21,21,.17);
  --cb-ease:cubic-bezier(.22,1,.36,1);
}
html,body { background:var(--cb-paper); color:var(--cb-ink); font-family:"Helvetica Neue",Helvetica,Arial,"Noto Sans Bengali",sans-serif; }
body::before { display:none; }
button { font-family:inherit; }
button:focus-visible,a:focus-visible { outline:2px solid var(--cb-red); outline-offset:3px; }
.skip-link { position:fixed; z-index:100; top:-100px; left:20px; padding:12px 18px; color:white; background:var(--cb-red); }
.skip-link:focus { top:10px; }
.app { background:var(--cb-paper); }
.topbar { height:62px; padding-inline:clamp(20px,4.8vw,80px); background:var(--cb-paper); border-color:var(--cb-rule); backdrop-filter:none; }
.brand { color:var(--cb-ink); font-family:inherit; font-size:12px; letter-spacing:.17em; gap:11px; }
.brandmark { width:5px; height:22px; border-radius:0; clip-path:none; transform:none; background:var(--cb-red); }
.brand small { border-color:var(--cb-rule); color:var(--cb-muted); font:700 10px inherit; }
.toplabel { color:var(--cb-muted); font-weight:700; }
.iconbtn { min-height:44px; min-width:44px; border:1px solid var(--cb-rule); border-radius:999px; color:var(--cb-ink); background:var(--cb-light); }

<script>
const slides=[
 {chapter:'The vision',theme:'dark',eyebrow:'The transformation ambition',title:'Invisible Banking',body:`<div class="first-hero"><div><h2 class="hero-title">Invisible<br><span class="accent">Banking.</span></h2><p class="hero-copy">Connecting City Bank around customers and businesses.</p><div class="grid cols3" style="margin-top:38px"><div class="labelbox"><b>Customer</b><p>One simple experience.</p></div><div class="labelbox"><b>Business</b><p>More value from each relationship.</p></div><div class="labelbox"><b>Bank</b><p>One connected institution.</p></div></div></div><div class="hero-ring" aria-hidden="true"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div></div>`,foot:'It just works.'},
 {chapter:'The vision',theme:'light',eyebrow:'The starting point',title:'City Bank has built the pieces.<br><strong>The next advantage is connection.</strong>',subtitle:'Transformation is already in motion. The opportunity is to make these strengths work together across City Bank.',body:`<div class="grid cols2" style="align-items:center"><div><span class="tag">Existing capabilities</span><div class="chiprow" style="margin-top:16px"><span class="chip">Citytouch</span><span class="chip">Blink</span><span class="chip">Blueprint</span><span class="chip">Cards + POS</span><span class="chip">Branches + CX</span><span class="chip">Corporate</span><span class="chip">SME + Medium</span><span class="chip">Islamic</span><span class="chip">Treasury</span><span class="chip">Data + IT</span></div></div><div class="panel"><span class="num">+</span><h3>AI adds a new possibility</h3><p>These capabilities can become more intelligent, responsive and connected.</p></div></div><div class="takeaway">More value from what City Bank already has.</div>`,foot:'Existing strengths · New connections'},
 {chapter:'The case for connection',theme:'dark',eyebrow:'A real overlap',title:'Today, one customer service<br>can be built twice.',subtitle:'When channels evolve separately, the same capability can appear in more than one place.',body:`<div class="grid cols2"><div class="panel"><span class="tag">Citytouch</span><h3 style="margin-top:16px">Digital banking services</h3><p>EMI conversion · Cheque book request · Statements · Address update</p></div><div class="panel"><span class="tag">CityAssist</span><h3 style="margin-top:16px">Customer queries and service requests</h3><p>Another route through which customers can ask City Bank to act.</p></div></div><div class="flowbars" style="margin-top:20px"><span>Repeated build</span><span>Two customer routes</span><span>Divided context</span></div>`,foot:'Illustrative overlap for validation'},
 {chapter:'The case for connection',theme:'light',eyebrow:'The business consequence',title:'Disconnected work<br><strong>can cost twice.</strong>',subtitle:'The issue is not only duplication. Useful signals and relationships may also fail to connect to the next business opportunity.',body:`<div class="grid cols2"><div class="panel"><span class="num">01</span><h3>Repeated effort</h3><p>Teams may design, build and maintain similar capabilities more than once.</p></div><div class="panel"><span class="num">02</span><h3>Missed growth</h3><p>POS data, corporate relationships or merchant networks may never connect to the next opportunity.</p></div></div><div class="takeaway">The potential cost: effort, time and revenue.</div>`,foot:'Hypothesis · Internal evidence required'},
 {chapter:'The idea',theme:'dark',eyebrow:'The idea',title:'An ecosystem makes City Bank work as one around a real need.',subtitle:'One relationship outside. Connected capabilities inside.',body:`<div class="split"><div class="orbit"><div class="diagram-center">CUSTOMER<br>NEED</div><div class="node">Businesses</div><div class="node">Channels</div><div class="node">Partners</div><div class="node">Data + AI</div><div class="node">Services</div></div><div style="display:flex;flex-direction:column;justify-content:center;gap:17px"><div class="labelbox"><b>Businesses</b><p>Products, services and financial solutions</p></div><div class="labelbox"><b>Channels</b><p>Digital, physical and assisted experiences</p></div><div class="labelbox"><b>Partners</b><p>Merchants, service providers and external ecosystems</p></div><div class="labelbox"><b>Data + AI</b><p>Shared intelligence, context and proactive assistance</p></div></div></div>`,foot:'One connected ecosystem'},
 {chapter:'Tangible journeys',theme:'light',eyebrow:'Consumer journey · Illustrative',title:'One evening can connect cards, merchants, loyalty and payments.',subtitle:'An anniversary dinner, made simpler at every step.',body:`<div class="path"><div class="step"><h3>01 · Choose</h3><p>Relevant restaurants and card privileges.</p></div><div class="step"><h3>02 · Book</h3><p>Availability and reservation.</p></div><div class="step"><h3>03 · Pay</h3><p>City Bank card and eligible benefit.</p></div><div class="step"><h3>04 · Reward</h3><p>Loyalty updates automatically.</p></div></div><div class="takeaway">One evening. One City Bank journey.</div>`,foot:'A journey concept, not a current service'},
 {chapter:'Tangible journeys',theme:'dark',eyebrow:'Merchant journey · Illustrative',title:'A POS relationship can grow into a merchant ecosystem.',subtitle:'Payment can become the start of a deeper business relationship.',body:`<div class="path darkpath"><div class="step"><h3>Accept</h3><p>Payments.</p></div><div class="step"><h3>Understand</h3><p>Sales, settlements and AI-assisted insights.</p></div><div class="step"><h3>Engage</h3><p>Orders, loyalty and relevant customer opportunities.</p></div><div class="step"><h3>Finance</h3><p>Working capital using verified cash flow.</p></div></div><div class="takeaway">Deepen the relationship and offer finance when evidence supports it.</div>`,foot:'Business-owned proposition · Subject to credit assessment'},
 {chapter:'Tangible journeys',theme:'light',eyebrow:'Corporate ecosystem · Illustrative',title:'One corporate client can open an entire business network.',subtitle:'A corporate relationship can connect employees, suppliers and distributors to multiple City Bank capabilities.',body:`<div style="text-align:center;margin-bottom:20px"><div class="panel" style="display:inline-block;padding:16px 40px;border-color:#cc3942"><span class="tag">Anchor relationship</span><h3 style="margin:6px 0 0">Corporate client</h3></div></div><div class="grid cols3"><div class="panel"><h3>Suppliers</h3><p>Payments · Trade & FX · SME / Medium finance</p></div><div class="panel"><h3>Employees</h3><p>Payroll · Cards · Savings · Finance</p></div><div class="panel"><h3>Distributors</h3><p>Collections · Payments · Working capital</p></div></div>`,foot:'Multi-business opportunity · Ownership to be defined'},
 {chapter:'The missing connection',theme:'dark',eyebrow:'The gap',title:'City Bank already owns the pieces.<br><strong>What is less structured is the connection.</strong>',subtitle:'Opportunities between businesses do not always have a natural first owner.',body:`<div class="grid cols4"><div class="panel"><h3>Businesses</h3><p>Products, customers and P&Ls</p></div><div class="panel"><h3>Blueprint</h3><p>Retail transformation</p></div><div class="panel"><h3>EPMO</h3><p>Delivery governance</p></div><div class="panel"><h3>Functions</h3><p>IT, Operations, CX and Data</p></div></div><div class="takeaway">The opportunity includes cross-bank AI integration, where intelligence in one area can create value elsewhere.</div>`,foot:'Mandate hypothesis · Requires stakeholder testing'},
 {chapter:'The proposed mandate',theme:'light',eyebrow:'A possible role',title:'A bank-wide transformation role can help connect the gaps.',subtitle:'Find the opportunity, shape it, connect the right owners, then move it into execution.',body:`<div class="flowbars"><span>SEE<br><small>Across the bank</small></span><span>SHAPE<br><small>The opportunity</small></span><span>CONNECT<br><small>The right owners</small></span><span>MOVE<br><small>To natural ownership</small></span></div><div class="grid cols2" style="margin-top:18px"><div class="panel"><h3>Horizontal transformation</h3><p>Cross-bank service, operations, data, AI integration and relationship intelligence.</p></div><div class="panel"><h3>Ecosystem transformation</h3><p>Connected journeys, partnerships, embedded services and new business opportunities.</p></div></div><div class="takeaway">Transformation connects. Businesses own. EPMO governs delivery.</div>`,foot:'A mandate to test, not a settled structure'},
 {chapter:'The proposed mandate',theme:'dark',eyebrow:'Clear boundaries',title:'It complements what already exists.',subtitle:'The role should make existing ownership work better across boundaries.',body:`<div class="matrix dark"><div>Business heads</div><div>Customers, products and P&L</div><div>Country Business Manager</div><div>Existing mandate remains intact</div><div>Blueprint</div><div>Retail transformation</div><div>EPMO</div><div>Execution governance</div><div>IT / CX / Operations / Data</div><div>Specialist ownership, including AI and technology capabilities</div><div>Transformation</div><div>Cross-bank opportunities, ecosystem development and AI-enabled business transformation</div></div>`,foot:'Subject to internal mandate validation'},
 {chapter:'Why this leader',theme:'light',eyebrow:'Already happening',title:'I am already doing parts of this, informally.',subtitle:'These began with a customer or business opportunity and involved connecting the relevant teams.',body:`<div class="grid cols4"><div class="panel"><span class="tag">Service</span><h3 style="margin-top:12px">DigiBox<br>Traceable courier</h3></div><div class="panel"><span class="tag">Digital & sales</span><h3 style="margin-top:12px">Citytouch features<br>Digital sales<br>Central offer site</h3></div><div class="panel"><span class="tag">Ecosystem</span><h3 style="margin-top:12px">Foreign Education Hub</h3></div><div class="panel"><span class="tag">Connection</span><h3 style="margin-top:12px">Citytouch × Blink</h3></div></div><div class="takeaway">Identify the opportunity → connect the teams → help move it forward.</div>`,foot:'Examples supplied for the role discussion'},
 {chapter:'Why this leader',theme:'dark',eyebrow:'From informal to structured',title:'What could become different?',subtitle:'The aim is better-connected projects with clear ownership and outcomes.',body:`<div class="grid cols2"><div class="panel"><span class="tag">Today</span><div class="text-list" style="margin-top:12px"><div>Opportunities surface unevenly</div><div>Connections happen informally</div><div>Progress relies on individual coordination</div></div></div><div class="panel"><span class="tag">More structured</span><div class="text-list" style="margin-top:12px"><div>Systematic opportunity discovery</div><div>Business cases shaped early</div><div>Owners connected and execution handover clear</div><div>Business outcome tracked</div></div></div></div><div class="takeaway">AI could help surface changes and connections continuously.</div>`,foot:'Proposed operating shift'},
 {chapter:'Why this leader',theme:'light',eyebrow:'The outcome',title:'Judge the role by whether businesses perform better.',subtitle:'The three outcomes from the opening give the measure.',body:`<div class="grid cols3"><div class="panel"><span class="num">01</span><h3>Customer</h3><p>Simpler, more connected and increasingly proactive journeys.</p></div><div class="panel"><span class="num">02</span><h3>Business</h3><p>Deeper relationships, better-informed decisions and new revenue opportunities.</p></div><div class="panel"><span class="num">03</span><h3>Bank</h3><p>Less duplication, faster execution, better intelligence and greater return on investment.</p></div></div>`,foot:'Proposed outcomes · Metrics to define'},
 {chapter:'Why this leader',theme:'red',eyebrow:'The opportunity',title:'Invisible Banking becomes real when City Bank works as one around the customer.',body:`<div style="max-width:810px;margin:auto 0"><p class="quote">I would like to explore how I can help make this more systematic, drawing on the cross-bank perspective developed through my current role, while businesses and functions retain their ownership.</p><div class="divider"></div><p class="bigline">A broader contribution to transformation and business.</p></div>`,foot:'The case for a formal mandate'},
 {chapter:'The possibilities',theme:'dark',eyebrow:'Internal prospects · 01 & 02',title:'What if the bank’s decisions evolved as fast as the world around it?',subtitle:'AI could turn periodic analysis into continuously updated business intelligence.',body:`<div class="prospect-layout"><button class="prospect" data-prospect="finance"><span class="num">01 / FINANCE</span><h3>A living business outlook</h3><p>Forecasts update as revenue, expenses, deposits, lending and external conditions change, with deviations and options surfaced for decision-makers.</p><span class="more">Explore prospect ↗</span></button><button class="prospect" data-prospect="trade"><span class="num">02 / TRADE & TREASURY</span><h3>Intelligence that follows global developments</h3><p>A shipping disruption triggers a review of affected import transactions, cash flows, finance needs and FX exposures across relevant teams.</p><span class="more">Explore prospect ↗</span></button></div><div class="takeaway">From periodic analysis to continuously informed decisions.</div>`,foot:'Illustrative prospects · Human review and controls required'},
 {chapter:'The possibilities',theme:'light',eyebrow:'Internal prospects · 03 & 04',title:'What if the bank could identify connections people might never discover?',subtitle:'AI could help the institution understand itself as one connected business.',body:`<div class="prospect-layout"><button class="prospect" data-prospect="dots"><span class="num">03 / CROSS-BANK INTELLIGENCE</span><h3>The bank connects its own dots</h3><p>Reused solutions, shared relationships, overlapping investment and combinations of businesses become visible to the right owners.</p><span class="more">Explore prospect ↗</span></button><button class="prospect" data-prospect="operations"><span class="num">04 / PROACTIVE OPERATIONS</span><h3>Problems surfaced before they spread</h3><p>Demand, service trends and capacity are connected so a campaign plan can adjust before processing bottlenecks reach customers.</p><span class="more">Explore prospect ↗</span></button></div><div class="takeaway">From intelligent functions to a more intelligent institution.</div>`,foot:'Illustrative prospects · Data and mandate validation required'},
 {chapter:'The possibilities',theme:'dark',eyebrow:'Customer prospects · 01 & 02',title:'What if City Bank knew what needed to happen next?',subtitle:'AI and ecosystem integration could make banking quietly responsive to real-life events.',body:`<div class="prospect-layout"><button class="prospect" data-prospect="health"><span class="num">01 / HEALTHCARE</span><h3>Help arrives when it is needed</h3><p>After a hospital payment, an eligible insurance benefit could be identified and a claim initiated where permissions, verification and information allow.</p><span class="more">Explore journey ↗</span></button><button class="prospect" data-prospect="travel"><span class="num">02 / TRAVEL</span><h3>The journey organises itself</h3><p>A verified flight purchase prompts eligible airport services and card privileges to be checked and, with permission, arranged to the customer’s preferences.</p><span class="more">Explore journey ↗</span></button></div><div class="takeaway">The customer lives the experience. The bank handles the complexity.</div>`,foot:'Future concepts · Partner and customer consent required'},
 {chapter:'The possibilities',theme:'light',eyebrow:'Customer prospects · 03 & 04',title:'What if banking quietly made everyday life better?',subtitle:'Relevant moments, existing benefits and the next permitted action connect.',body:`<div class="prospect-layout"><button class="prospect" data-prospect="coffee"><span class="num">03 / EVERYDAY LIFESTYLE</span><h3>The right benefit, without searching</h3><p>With permission, a favourite coffee shop becomes a cue for an eligible merchant-funded benefit to apply automatically at payment.</p><span class="more">Explore journey ↗</span></button><button class="prospect" data-prospect="service"><span class="num">04 / PROACTIVE SERVICE</span><h3>The bank starts fixing things first</h3><p>A failed payment with a debit is detected; reconciliation and investigation begin, and the customer receives an update before raising a request.</p><span class="more">Explore journey ↗</span></button></div><div class="takeaway">From responding to requests to anticipating needs.</div>`,foot:'Future concepts · Subject to feasibility and controls'},
 {chapter:'Conclusion',theme:'red',eyebrow:'The conclusion',title:'The future of Invisible Banking is connected, intelligent and continuous.',body:`<div class="grid cols3" style="margin-bottom:28px"><div class="labelbox"><b>Customers</b><p>A bank that understands needs and quietly makes life easier.</p></div><div class="labelbox"><b>Businesses</b><p>New opportunities and deeper relationships.</p></div><div class="labelbox"><b>Bank</b><p>Capabilities, intelligence and investment working together.</p></div></div><div class="flowbars"><span>See what others may miss</span><span>Connect what already exists</span><span>Create what comes next</span></div><div style="margin-top:auto"><h2 class="final-mark">Invisible Banking.</h2><p class="final-tag">It just works.</p></div>`,foot:'A proposition to test, build and own across City Bank'}
];
const prospects={
 finance:{kind:'Internal prospect 01 · Finance',title:'A living business outlook',lede:'A continuously refreshed view of the business, with changes highlighted for accountable decision-makers.',moment:'Revenue, expenses, deposits, lending, market movements and trends change after the planning snapshot.',response:'Models update projections, show drivers of variance and present options for Finance to review, challenge and act on.',value:'More timely decisions, improved resource deployment and potential profitability gains. Impact requires baseline and pilot measurement.',connections:'Finance + business data + market data + model governance.',guardrail:'Forecasts and recommendations need data quality checks, explainability and human ownership of decisions.'},
 trade:{kind:'Internal prospect 02 · Trade & Treasury',title:'Intelligence that follows global developments',lede:'Global developments can be mapped against affected clients and transactions as conditions change.',moment:'A shipping disruption, tariff change, commodity move or FX shock affects an import corridor.',response:'Potentially affected transactions, cash-flow expectations, finance needs and FX exposures are flagged to Trade, Treasury, Corporate, Credit and relationship managers for review.',value:'Earlier intervention, clearer risk awareness and more relevant client solutions.',connections:'Trade + Treasury + Corporate + Credit + external intelligence.',guardrail:'External signals may be incomplete. Credit, suitability and market decisions remain with authorised teams.'},
 dots:{kind:'Internal prospect 03 · Cross-bank intelligence',title:'The bank connects its own dots',lede:'Shared intelligence can surface useful relationships between work that would otherwise remain separate.',moment:'A corporate payroll relationship expands while Retail, Cards and savings teams develop related propositions.',response:'A governed capability identifies the overlap, relevant existing solutions, dependencies and possible cross-business proposition for owners to assess.',value:'Potentially less duplication, more cross-sell and greater value from existing capabilities.',connections:'Corporate + Retail + Cards + Data + relevant control functions.',guardrail:'Access must respect need-to-know, customer permissions and product ownership. A shared view is not a licence to share all data.'},
 operations:{kind:'Internal prospect 04 · Operations',title:'Problems surfaced before they spread',lede:'Demand signals and operational capacity could inform business decisions before customers feel a bottleneck.',moment:'A lending campaign is expected to create more applications than current processing capacity.',response:'The business, Marketing and Operations receive an early scenario showing capacity options, campaign timing and likely service effects.',value:'Better allocation, steadier execution and fewer avoidable customer issues.',connections:'Business + Marketing + Operations + service and capacity data.',guardrail:'Forecast uncertainty should be visible. Operational decisions remain with accountable owners.'},
 health:{kind:'Customer journey 01 · Healthcare',title:'Help arrives when it is needed',lede:'The hospital payment could start a coordinated benefit journey, subject to explicit permissions and partner integration.',moment:'A customer is hospitalised and makes a payment.',response:'An eligible insurance benefit is checked. With prior authorisation, verified information and insurer support, a claim can be initiated and status tracked.',value:'Less administrative burden in a difficult moment, and greater value from an eligible benefit.',connections:'Payments + Cards + insurer + hospital + consented coordination.',guardrail:'A payment alone cannot establish hospitalisation or coverage. Insurance, privacy, consent and claim rules must govern the journey.'},
 travel:{kind:'Customer journey 02 · Travel',title:'The journey organises itself',lede:'A verified flight purchase could activate eligible services without a separate search and booking process.',moment:'A customer purchases a flight ticket.',response:'Card privileges are checked, and with the customer’s saved preferences and authorisation, meet-and-greet or airport services can be arranged. Changes can trigger updates.',value:'Eligible benefits become easier to use and reinforce the card relationship.',connections:'Cards + airlines + airport and travel partners + preference management.',guardrail:'A card transaction may not contain a verified itinerary. Inventory, eligibility and partner confirmation are essential.'},
 coffee:{kind:'Customer journey 03 · Everyday lifestyle',title:'The right benefit, without searching',lede:'Everyday merchant activity could make benefits more relevant and simpler to redeem.',moment:'A customer regularly buys coffee at a preferred merchant.',response:'With permission, the bank recognises a preference and applies an eligible merchant-funded or loyalty benefit automatically at payment.',value:'A useful customer benefit, more merchant engagement and potentially deeper payment preference.',connections:'Cards + POS + merchant partners + loyalty + consented personalisation.',guardrail:'Preferences should not become intrusive surveillance. Funding, eligibility, consent and fairness need testing.'},
 service:{kind:'Customer journey 04 · Proactive service',title:'The bank starts fixing things first',lede:'The bank can detect a transaction problem, begin investigation and keep the customer informed.',moment:'A payment appears to fail, but the account is debited.',response:'Payment and settlement records are checked; a recovery or investigation is opened where appropriate, with clear customer updates through resolution.',value:'Less chasing, lower uncertainty and more trust in the payment experience.',connections:'Payments + Operations + Service + transaction intelligence.',guardrail:'Transaction states can be ambiguous. The bank must distinguish pending, failed and settled payments before promising resolution.'}
};
let current=0, lastFocus=null;
const stage=document.getElementById('stage'), overview=document.getElementById('overview'), detail=document.getElementById('detail');
function render(){const s=slides[current];stage.innerHTML=`<article class="slide ${s.theme==='light'?'light':s.theme==='red'?'red':''} active" aria-label="Slide ${current+1}: ${s.title.replace(/<[^>]*>/g,'')}"><div class="inner">${current!==0?`<div class="eyebrow">${s.eyebrow}</div><h1 class="title">${s.title}</h1>${s.subtitle?`<p class="subtitle">${s.subtitle}</p>`:''}`:''}<div class="main">${s.body}</div><div class="footerline"><span>${s.foot||''}</span><span class="slide-index">${String(current+1).padStart(2,'0')} / ${slides.length}</span></div></div></article>`;document.getElementById('chapter').textContent=s.chapter;document.getElementById('counter').textContent=`${String(current+1).padStart(2,'0')} / ${slides.length}`;document.getElementById('progress').style.width=`${(current+1)/slides.length*100}%`;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1;stage.scrollTop=0;history.replaceState(null,'',`#slide-${current+1}`);}
function go(n){current=Math.max(0,Math.min(slides.length-1,n));render()}
function show(el){lastFocus=document.activeElement;el.classList.add('open');document.body.style.overflow='hidden';el.querySelector('.close').focus()}
function close(){const opened=document.querySelector('.overlay.open');if(opened){opened.classList.remove('open');document.body.style.overflow='';lastFocus?.focus()}}
document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);
document.getElementById('overviewBtn').onclick=()=>{document.getElementById('overviewGrid').innerHTML=slides.map((s,i)=>`<button class="thumb" data-slide="${i}"><span>${String(i+1).padStart(2,'0')} / ${slides.length}</span><strong>${s.title.replace(/<[^>]*>/g,'')}</strong><small>${s.chapter}</small></button>`).join('');show(overview)};
document.getElementById('fullBtn').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};
document.addEventListener('click',e=>{const prospect=e.target.closest('[data-prospect]');if(prospect){const p=prospects[prospect.dataset.prospect];document.getElementById('detailContent').innerHTML=`<div class="kicker">${p.kind}</div><h2>${p.title}</h2><p class="lede">${p.lede}</p><div class="detail-grid"><section><h3>The moment</h3><p>${p.moment}</p></section><section><h3>Behind the scenes</h3><p>${p.response}</p></section><section><h3>Potential value</h3><p>${p.value}</p></section><section><h3>Connected capabilities</h3><p>${p.connections}</p></section><section style="grid-column:1/-1"><h3>What needs validation</h3><p>${p.guardrail}</p></section></div><p class="fine">Illustrative future concept. No City Bank capability, partner integration or customer outcome is asserted as live.</p>`;show(detail)}const thumb=e.target.closest('[data-slide]');if(thumb){close();go(Number(thumb.dataset.slide))}if(e.target.matches('[data-close]'))close();if(e.target.classList.contains('overlay'))close()});
document.addEventListener('keydown',e=>{if(document.querySelector('.overlay.open')){if(e.key==='Escape')close();return}if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}else if(e.key==='Home')go(0);else if(e.key==='End')go(slides.length-1);else if(e.key.toLowerCase()==='o')document.getElementById('overviewBtn').click();else if(e.key.toLowerCase()==='f')document.getElementById('fullBtn').click()});
let touchX=0,touchY=0;stage.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX;touchY=e.changedTouches[0].screenY},{passive:true});stage.addEventListener('touchend',e=>{if(window.innerWidth<=560)return;const dx=e.changedTouches[0].screenX-touchX,dy=e.changedTouches[0].screenY-touchY;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)go(current+(dx<0?1:-1))},{passive:true});
const hash=location.hash.match(/^#slide-(\d+)$/);current=hash?Math.max(0,Math.min(slides.length-1,Number(hash[1])-1)):0;render();window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#slide-(\d+)$/);if(m&&Number(m[1])-1!==current)go(Number(m[1])-1)});
</script>
<script>
/* Editorial treatment and compact causal motion diagrams for the preserved story. */
const flowLabels = {
  finance:['New signals','Forecast review'],
  trade:['Global event','Exposure review'],
  dots:['Shared clue','New proposition'],
  operations:['Demand signal','Capacity plan'],
  health:['Hospital payment','Benefit check'],
  travel:['Flight booking','Service arranged'],
  coffee:['Usual purchase','Benefit applied'],
  service:['Payment mismatch','Case initiated']
};

const renderStory = render;
render = function () {
  renderStory();
  const slide = stage.querySelector('.slide');
  slide.classList.remove('light','red');
  slide.classList.add(current === 0 ? 'cinematic' : [14,19].includes(current) ? 'red' : 'light');
  slide.dataset.scene = String(current + 1);
  slide.querySelectorAll('[data-prospect]').forEach(card => {
    const labels = flowLabels[card.dataset.prospect];
    if (!labels) return;
    const diagram = document.createElement('div');
    diagram.className = 'mini-flow';
    diagram.setAttribute('aria-hidden','true');
    diagram.innerHTML = `<span>${labels[0]}</span><span class="flow-track"><i></i></span><span>${labels[1]}</span>`;
    card.insertBefore(diagram,card.querySelector('.more'));
  });
};
render();

const motionBtn = document.getElementById('motionBtn');
function toggleMotion() {
  const paused = document.body.classList.toggle('motion-paused');
  motionBtn.textContent = paused ? 'Play motion' : 'Pause motion';
  motionBtn.setAttribute('aria-label',paused ? 'Play animation' : 'Pause animation');
  motionBtn.setAttribute('aria-pressed',String(paused));
}
motionBtn.addEventListener('click',toggleMotion);
document.addEventListener('keydown',event => {
  if (event.key.toLowerCase() === 'm' && !event.altKey && !event.ctrlKey && !event.metaKey && !document.querySelector('.overlay.open')) {
    event.preventDefault();
    toggleMotion();
  }
});

</script>
</body>
