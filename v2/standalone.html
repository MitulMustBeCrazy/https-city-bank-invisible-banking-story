<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f0e8">
  <meta name="description" content="City Bank Invisible Banking: a connected, intelligent and proactive transformation story.">
  <title>Invisible Banking | Transformation story</title>
  <style>
:root {
  --paper:#f4f0e8;
  --paper-light:#fcfaf6;
  --ink:#151515;
  --muted:#6d6964;
  --red:#d71920;
  --red-deep:#b30d15;
  --white:#fffefb;
  --rule:rgba(21,21,21,.16);
  --rule-light:rgba(255,255,255,.22);
  --ease:cubic-bezier(.22,1,.36,1);
  --ui-h:62px;
}

* { box-sizing:border-box; }
html,body { width:100%; height:100%; margin:0; overflow:hidden; }
body { background:var(--paper); color:var(--ink); font-family:"Helvetica Neue",Helvetica,Arial,"Noto Sans Bengali",sans-serif; }
button { font:inherit; }
button:focus-visible,a:focus-visible { outline:2px solid var(--red); outline-offset:3px; }
.skip-link { position:fixed; z-index:100; top:-100px; left:20px; padding:12px 18px; background:var(--red); color:white; }
.skip-link:focus { top:10px; }

.app { height:100dvh; min-height:520px; display:flex; flex-direction:column; background:var(--paper); }
.topbar,.bottom { flex:none; height:var(--ui-h); display:flex; align-items:center; padding-inline:clamp(20px,4.8vw,80px); background:var(--paper); border-color:var(--rule); z-index:20; }
.topbar { justify-content:space-between; border-bottom:1px solid var(--rule); }
.bottom { justify-content:space-between; gap:20px; border-top:1px solid var(--rule); }
.brand { display:flex; align-items:center; gap:11px; color:var(--ink); font-size:12px; font-weight:800; letter-spacing:.17em; text-transform:uppercase; white-space:nowrap; }
.brand-rule { width:5px; height:22px; background:var(--red); }
.brand small { padding-left:14px; border-left:1px solid var(--rule); color:var(--muted); font-size:10px; font-weight:700; letter-spacing:.2em; }
.top-actions { display:flex; align-items:center; gap:8px; }
.toplabel { margin-right:11px; color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.17em; text-transform:uppercase; }
.control,.nav { min-width:44px; height:44px; border:1px solid var(--rule); border-radius:999px; background:var(--paper-light); color:var(--ink); cursor:pointer; transition:border-color .22s,color .22s,background .22s,transform .22s var(--ease); }
.control:hover,.nav:not(:disabled):hover { border-color:var(--red); background:var(--red); color:white; transform:translateY(-1px); }
.icon-control { display:grid; place-items:center; }
.icon-control svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.motion-toggle { min-width:108px; padding-inline:14px; font-size:9px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
.nav { font-size:18px; }
.nav:disabled { opacity:.25; cursor:default; }
.chapter,.counter { color:var(--ink); font-size:10px; font-weight:800; letter-spacing:.15em; text-transform:uppercase; }
.chapter,.hint { min-width:200px; }
.hint { color:var(--muted); font-size:10px; text-align:right; }
.navgroup { display:flex; align-items:center; gap:12px; }
.counter { min-width:64px; text-align:center; }

.stage { flex:1; min-height:0; display:grid; place-items:center; padding:clamp(10px,2.1vh,20px) clamp(12px,3vw,46px); perspective:1200px; }
.slide { position:relative; width:min(100%,calc((100dvh - 152px)*1.77778)); max-height:calc(100dvh - 152px); aspect-ratio:16/9; overflow:hidden; border:1px solid var(--rule); box-shadow:0 19px 60px rgba(47,31,24,.09); isolation:isolate; container-type:inline-size; animation:scene-enter .72s var(--ease) both; }
.slide.tone-paper { background:var(--paper); color:var(--ink); }
.slide.tone-dark { background:#0d0d0d; color:var(--white); border-color:#222; box-shadow:0 28px 74px rgba(0,0,0,.24); }
.slide.tone-red { background:var(--red); color:var(--white); border-color:var(--red); box-shadow:0 28px 74px rgba(89,0,3,.18); }
.slide::after { content:""; position:absolute; z-index:-2; width:58%; aspect-ratio:1; right:-28%; top:-38%; border:1px solid rgba(215,25,32,.13); border-radius:50%; box-shadow:0 0 0 54px rgba(215,25,32,.035),0 0 0 108px rgba(215,25,32,.024); animation:ring-breathe 9s ease-in-out infinite; }
.tone-dark::after,.tone-red::after { border-color:rgba(255,255,255,.16); box-shadow:0 0 0 54px rgba(255,255,255,.045),0 0 0 108px rgba(255,255,255,.025); }
.slide-canvas { position:relative; z-index:2; height:100%; padding:clamp(25px,3.7vw,61px) clamp(38px,6vw,98px) clamp(24px,3.2vw,52px); display:flex; flex-direction:column; }
.signal-rail { position:absolute; z-index:3; left:clamp(20px,2.8vw,44px); top:10%; bottom:10%; width:1px; background:var(--rule); overflow:visible; }
.tone-dark .signal-rail,.tone-red .signal-rail { background:var(--rule-light); }
.signal-rail::before { content:""; position:absolute; top:0; left:-2px; width:5px; height:24%; background:linear-gradient(180deg,transparent,var(--red),transparent); animation:rail-travel 4.8s var(--ease) infinite; }
.tone-red .signal-rail::before { background:linear-gradient(180deg,transparent,#fff,transparent); }
.signal-rail::after { content:"TRANSFORM"; position:absolute; left:-6px; bottom:-1px; color:var(--muted); font-size:7px; font-weight:800; letter-spacing:.19em; writing-mode:vertical-rl; transform:rotate(180deg); }
.tone-dark .signal-rail::after,.tone-red .signal-rail::after { color:rgba(255,255,255,.48); }

.scene-header { flex:none; max-width:92%; }
.eyebrow { display:flex; align-items:center; gap:11px; color:var(--red); font-size:clamp(8px,.74vw,11px); font-weight:800; letter-spacing:.22em; text-transform:uppercase; }
.eyebrow::before { content:""; width:30px; height:1px; background:currentColor; }
.tone-dark .eyebrow,.tone-red .eyebrow { color:white; }
.title { max-width:1040px; margin:clamp(12px,1.55vw,24px) 0 0; font-size:clamp(28px,3.55vw,60px); line-height:.98; font-weight:800; letter-spacing:-.058em; text-wrap:balance; }
.title .accent { color:var(--red); }
.tone-red .title .accent { color:white; }
.subtitle { max-width:780px; margin:clamp(10px,1.2vw,18px) 0 0; color:var(--muted); font-size:clamp(12px,1vw,16px); line-height:1.44; }
.tone-dark .subtitle,.tone-red .subtitle { color:rgba(255,255,255,.7); }
.scene-body { flex:1; min-height:0; margin-top:clamp(15px,1.8vw,28px); display:flex; flex-direction:column; justify-content:center; }
.scene-footer { flex:none; display:flex; justify-content:space-between; align-items:center; gap:20px; margin-top:auto; padding-top:11px; border-top:1px solid var(--rule); color:var(--muted); font-size:clamp(7px,.62vw,10px); font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
.tone-dark .scene-footer,.tone-red .scene-footer { border-color:var(--rule-light); color:rgba(255,255,255,.6); }
.progress { position:absolute; z-index:30; left:0; right:0; bottom:var(--ui-h); height:2px; background:var(--rule); }
.progress span { display:block; height:100%; width:0; background:var(--red); transition:width .52s var(--ease); }

.micro { color:var(--red); font-size:clamp(8px,.7vw,11px); font-weight:800; letter-spacing:.17em; text-transform:uppercase; }
.tone-dark .micro,.tone-red .micro { color:#fff; }
.rule-top { border-top:1px solid var(--rule); }
.tone-dark .rule-top,.tone-red .rule-top { border-color:var(--rule-light); }
.quiet { color:var(--muted); }
.tone-dark .quiet,.tone-red .quiet { color:rgba(255,255,255,.65); }
.red-text { color:var(--red); }
.tone-red .red-text { color:white; }

/* 01 · Cover */
.cover .slide-canvas { padding-block:clamp(35px,5vw,80px); }
.cover .signal-rail { display:none; }
.cover-grid { height:100%; display:grid; grid-template-columns:1.07fr .93fr; align-items:center; gap:4%; }
.cover-title { margin:0; font-size:clamp(54px,8.4vw,142px); line-height:.78; font-weight:850; letter-spacing:-.09em; }
.cover-title span { display:block; color:var(--red); }
.cover-copy { max-width:560px; margin:clamp(20px,2.2vw,34px) 0 0; color:rgba(255,255,255,.78); font-size:clamp(14px,1.25vw,20px); line-height:1.35; }
.cover-outcomes { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:clamp(25px,3vw,46px); }
.cover-outcome { padding-left:14px; border-left:1px solid var(--red); }
.cover-outcome b { display:block; font-size:clamp(9px,.72vw,12px); letter-spacing:.12em; text-transform:uppercase; }
.cover-outcome span { display:block; margin-top:7px; color:rgba(255,255,255,.62); font-size:clamp(9px,.78vw,12px); line-height:1.35; }
.cover-orbit { position:relative; width:min(37vw,430px); aspect-ratio:1; justify-self:center; }
.cover-orbit .ring { position:absolute; border:1px solid rgba(255,255,255,.2); border-radius:50%; inset:0; animation:orbit-breathe 7s ease-in-out infinite; }
.cover-orbit .ring:nth-child(2) { inset:17%; animation-delay:-1.5s; }
.cover-orbit .ring:nth-child(3) { inset:34%; animation-delay:-3s; }
.cover-orbit .core { position:absolute; inset:43%; border-radius:50%; background:var(--red); animation:core-pulse 4.6s ease-in-out infinite; }
.cover-orbit .orbit-dot { position:absolute; width:10px; aspect-ratio:1; border-radius:50%; background:var(--red); box-shadow:0 0 0 7px rgba(215,25,32,.16); }
.cover-orbit .orbit-dot:nth-of-type(1) { top:16%; left:26%; animation:node-pulse 5s ease-in-out infinite; }
.cover-orbit .orbit-dot:nth-of-type(2) { top:43%; right:0; animation:node-pulse 5s 1.25s ease-in-out infinite; }
.cover-orbit .orbit-dot:nth-of-type(3) { bottom:9%; left:37%; animation:node-pulse 5s 2.5s ease-in-out infinite; }
.cover-orbit .orbit-dot:nth-of-type(4) { bottom:29%; left:7%; animation:node-pulse 5s 3.75s ease-in-out infinite; }

/* 02 · Capability field */
.capability-scene { display:grid; grid-template-columns:.86fr 1.14fr; gap:8%; align-items:center; height:100%; }
.advantage-line { font-size:clamp(24px,2.6vw,43px); line-height:1.05; font-weight:800; letter-spacing:-.05em; }
.advantage-line span { display:block; color:var(--red); }
.capability-field { position:relative; min-height:270px; display:grid; grid-template-columns:repeat(4,1fr); align-content:center; gap:12px; }
.capability-field::before { content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:var(--rule); }
.capability { position:relative; z-index:2; padding:13px 11px; border-block:1px solid var(--rule); background:var(--paper); text-align:center; font-size:clamp(9px,.75vw,12px); font-weight:750; animation:capability-align 7.2s var(--ease) infinite; }
.capability:nth-child(2n) { animation-delay:-1.8s; }
.capability:nth-child(3n) { animation-delay:-3.6s; }
.capability.ai { grid-column:2/4; color:white; background:var(--red); border-color:var(--red); animation:ai-connect 5.5s var(--ease) infinite; }

/* 03 · Overlap */
.overlap-scene { display:grid; grid-template-columns:1fr .4fr 1fr; gap:2.5%; align-items:stretch; height:100%; }
.service-lane { position:relative; padding:18px 20px; border-top:1px solid var(--rule); }
.service-lane h3 { margin:8px 0 17px; font-size:clamp(20px,1.8vw,30px); letter-spacing:-.04em; }
.service-lane ul { margin:0; padding:0; list-style:none; color:var(--muted); font-size:clamp(10px,.82vw,13px); line-height:1.7; }
.service-lane::after { content:""; position:absolute; top:50%; width:28%; height:1px; background:var(--red); animation:lane-converge 4.5s var(--ease) infinite; }
.service-lane.left::after { right:-15%; }
.service-lane.right::after { left:-15%; }
.overlap-core { align-self:center; justify-self:center; width:min(100%,112px); display:grid; place-items:center; aspect-ratio:1; border-radius:50%; background:var(--red); color:white; text-align:center; font-size:clamp(9px,.74vw,12px); font-weight:800; letter-spacing:.09em; text-transform:uppercase; animation:core-pulse 4.5s var(--ease) infinite; }

/* 04 · Consequence */
.consequence-scene { display:grid; grid-template-columns:1fr 1px 1fr; gap:5%; align-items:center; height:100%; }
.consequence-divider { height:82%; background:var(--rule); position:relative; overflow:hidden; }
.consequence-divider::after { content:""; position:absolute; inset:auto 0 100% 0; height:32%; background:var(--red); animation:vertical-scan 4.8s var(--ease) infinite; }
.consequence { align-self:stretch; display:flex; flex-direction:column; justify-content:center; }
.consequence-word { font-size:clamp(48px,7vw,116px); line-height:.8; font-weight:850; letter-spacing:-.085em; }
.consequence:nth-child(3) .consequence-word { color:var(--red); }
.consequence h3 { margin:22px 0 7px; font-size:clamp(14px,1.25vw,20px); text-transform:uppercase; letter-spacing:.08em; }
.consequence p { max-width:360px; margin:0; color:var(--muted); font-size:clamp(10px,.86vw,14px); line-height:1.45; }

/* 05 · Ecosystem */
.ecosystem-scene { display:grid; grid-template-columns:.74fr 1.26fr; gap:5%; height:100%; align-items:center; }
.ecosystem-copy { font-size:clamp(22px,2.35vw,40px); line-height:1.07; font-weight:800; letter-spacing:-.05em; }
.ecosystem-map { position:relative; min-height:310px; display:grid; place-items:center; }
.ecosystem-map::before,.ecosystem-map::after { content:""; position:absolute; border:1px solid rgba(215,25,32,.22); border-radius:50%; animation:ring-breathe 7s ease-in-out infinite; }
.ecosystem-map::before { width:53%; aspect-ratio:1; }
.ecosystem-map::after { width:79%; aspect-ratio:1; animation-delay:-2s; }
.ecosystem-core { z-index:3; width:31%; aspect-ratio:1; display:grid; place-items:center; border-radius:50%; background:var(--red); color:white; text-align:center; font-size:clamp(12px,1.15vw,19px); font-weight:800; line-height:1.05; animation:core-pulse 5s ease-in-out infinite; }
.ecosystem-node { position:absolute; z-index:4; min-width:112px; padding:10px 13px; border:1px solid var(--rule); border-radius:999px; background:var(--paper-light); text-align:center; font-size:clamp(8px,.68vw,11px); font-weight:800; letter-spacing:.08em; text-transform:uppercase; animation:node-signal 6s var(--ease) infinite; }
.ecosystem-node:nth-of-type(2) { top:5%; left:40%; }
.ecosystem-node:nth-of-type(3) { right:2%; top:43%; animation-delay:1.5s; }
.ecosystem-node:nth-of-type(4) { bottom:4%; left:38%; animation-delay:3s; }
.ecosystem-node:nth-of-type(5) { left:1%; top:43%; animation-delay:4.5s; }

/* 06–07 · Journeys */
.journey-scene { display:flex; flex-direction:column; justify-content:center; height:100%; }
.journey-track { position:relative; display:grid; grid-template-columns:repeat(4,1fr); gap:0; }
.journey-track::before { content:""; position:absolute; left:0; right:0; top:17px; height:1px; background:var(--rule); }
.journey-track::after { content:""; position:absolute; left:0; top:14px; width:7px; height:7px; border-radius:50%; background:var(--red); animation:journey-travel 8s var(--ease) infinite; }
.journey-step { position:relative; padding:43px 18px 0 0; }
.journey-step::before { content:""; position:absolute; top:12px; left:0; width:11px; height:11px; border-radius:50%; background:var(--paper); border:2px solid var(--red); }
.journey-step:nth-child(2) { animation:stage-focus 8s 2s ease-in-out infinite; }
.journey-step:nth-child(3) { animation:stage-focus 8s 4s ease-in-out infinite; }
.journey-step:nth-child(4) { animation:stage-focus 8s 6s ease-in-out infinite; }
.journey-step .step-no { color:var(--red); font-size:9px; font-weight:800; letter-spacing:.15em; }
.journey-step h3 { margin:9px 0 7px; font-size:clamp(16px,1.5vw,25px); letter-spacing:-.04em; }
.journey-step p { max-width:175px; margin:0; color:var(--muted); font-size:clamp(9px,.76vw,12px); line-height:1.45; }
.journey-close { margin-top:auto; padding-top:14px; border-top:1px solid var(--rule); font-size:clamp(14px,1.3vw,21px); font-weight:750; }
.journey-close span { color:var(--red); }

/* 08 · Network */
.network-scene { display:grid; grid-template-columns:.72fr 1.28fr; gap:7%; height:100%; align-items:center; }
.network-lead { font-size:clamp(22px,2.4vw,41px); line-height:1.06; font-weight:800; letter-spacing:-.052em; }
.network-map { position:relative; min-height:300px; display:grid; place-items:center; }
.network-hub { z-index:3; width:185px; padding:28px 20px; background:var(--ink); color:white; text-align:center; font-size:clamp(12px,1vw,16px); font-weight:800; }
.network-node { position:absolute; z-index:4; width:135px; padding:13px 10px; border-block:1px solid var(--rule); background:var(--paper); text-align:center; font-size:clamp(9px,.75vw,12px); font-weight:800; animation:node-signal 6s var(--ease) infinite; }
.network-node:nth-of-type(2) { top:3%; left:7%; }
.network-node:nth-of-type(3) { right:4%; top:35%; animation-delay:2s; }
.network-node:nth-of-type(4) { bottom:20%; left:11%; animation-delay:4s; }
.network-link { position:absolute; z-index:1; left:50%; top:50%; width:39%; height:1px; transform-origin:left; background:var(--rule); overflow:hidden; }
.network-link::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent,var(--red),transparent); animation:link-flow 4s linear infinite; }
.network-link.l1 { transform:rotate(-145deg); }
.network-link.l2 { transform:rotate(-15deg); animation-delay:1.3s; }
.network-link.l3 { transform:rotate(142deg); animation-delay:2.6s; }
.capability-line { position:absolute; left:0; right:0; bottom:0; display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
.capability-line span { padding:5px 8px; border:1px solid var(--rule); border-radius:999px; color:var(--muted); font-size:8px; font-weight:800; letter-spacing:.06em; }

/* 09 · Gap */
.gap-scene { display:grid; grid-template-columns:1fr .6fr 1fr; gap:4%; align-items:center; height:100%; }
.mandate-stack { display:grid; gap:1px; border-block:1px solid var(--rule); }
.mandate-row { display:flex; justify-content:space-between; gap:18px; padding:11px 0; border-bottom:1px solid var(--rule); font-size:clamp(9px,.78vw,12px); }
.mandate-row:last-child { border-bottom:0; }
.mandate-row b { color:var(--red); font-size:9px; letter-spacing:.1em; text-transform:uppercase; }
.gap-space { position:relative; display:grid; place-items:center; height:77%; border-inline:1px solid var(--rule); }
.gap-space::before { content:""; position:absolute; left:15%; right:15%; top:50%; height:1px; background:var(--red); transform:scaleX(.05); animation:bridge-grow 5.6s var(--ease) infinite; }
.gap-label { z-index:2; padding:12px 9px; background:var(--paper); color:var(--red); text-align:center; font-size:clamp(9px,.78vw,12px); font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
.gap-callout { font-size:clamp(21px,2.3vw,39px); line-height:1.08; font-weight:800; letter-spacing:-.05em; }
.gap-callout span { display:block; margin-top:15px; color:var(--muted); font-size:clamp(10px,.85vw,14px); line-height:1.45; font-weight:450; letter-spacing:0; }

/* 10 · Role */
.role-scene { display:grid; grid-template-columns:1.25fr .75fr; gap:6%; align-items:center; height:100%; }
.role-process { position:relative; display:grid; grid-template-columns:repeat(4,1fr); }
.role-process::before { content:""; position:absolute; left:4%; right:4%; top:26px; height:2px; background:var(--rule); }
.role-process::after { content:""; position:absolute; left:4%; top:25px; width:9px; height:4px; background:var(--red); animation:role-travel 7s var(--ease) infinite; }
.role-step { position:relative; padding:57px 12px 0 0; }
.role-step::before { content:""; position:absolute; top:20px; left:0; width:13px; height:13px; border-radius:50%; background:var(--paper); border:2px solid var(--red); }
.role-step b { display:block; font-size:clamp(15px,1.4vw,23px); letter-spacing:-.03em; }
.role-step span { display:block; margin-top:7px; color:var(--muted); font-size:clamp(9px,.75vw,12px); line-height:1.4; }
.role-domains { display:grid; gap:16px; }
.role-domain { padding:16px 0; border-block:1px solid var(--rule); }
.role-domain b { display:block; color:var(--red); font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
.role-domain p { margin:8px 0 0; color:var(--muted); font-size:clamp(9px,.78vw,13px); line-height:1.42; }

/* 11 · Boundaries */
.boundary-scene { display:grid; grid-template-columns:1fr 1fr; gap:5%; height:100%; }
.boundary-list { align-self:center; border-top:1px solid var(--rule); }
.boundary-row { display:grid; grid-template-columns:.72fr 1.28fr; gap:18px; padding:9px 0; border-bottom:1px solid var(--rule); font-size:clamp(9px,.76vw,12px); line-height:1.35; }
.boundary-row b { color:var(--red); letter-spacing:.05em; }
.boundary-bridge { position:relative; align-self:center; min-height:260px; display:grid; place-items:center; }
.boundary-bridge::before { content:""; position:absolute; inset:8% 4%; border:1px solid var(--rule); border-radius:50%; animation:ring-breathe 6s ease-in-out infinite; }
.boundary-bridge::after { content:""; position:absolute; left:12%; right:12%; top:50%; height:1px; background:linear-gradient(90deg,transparent,var(--red),transparent); animation:bridge-scan 4.6s ease-in-out infinite; }
.bridge-copy { z-index:2; width:56%; aspect-ratio:1; display:grid; place-items:center; border-radius:50%; background:var(--red); color:white; padding:16px; text-align:center; font-size:clamp(11px,1vw,16px); font-weight:800; line-height:1.2; }

/* 12 · Evidence */
.evidence-scene { position:relative; height:100%; display:grid; grid-template-columns:repeat(4,1fr); gap:26px; align-items:center; }
.evidence-scene::before { content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:var(--rule); }
.evidence-item { position:relative; z-index:2; min-height:125px; padding:17px 0; border-block:1px solid var(--rule); background:var(--paper); animation:evidence-focus 8s var(--ease) infinite; }
.evidence-item:nth-child(2) { animation-delay:2s; }
.evidence-item:nth-child(3) { animation-delay:4s; }
.evidence-item:nth-child(4) { animation-delay:6s; }
.evidence-item b { display:block; color:var(--red); font-size:9px; letter-spacing:.14em; text-transform:uppercase; }
.evidence-item p { margin:13px 0 0; font-size:clamp(13px,1.05vw,17px); line-height:1.45; font-weight:750; }
.evidence-item::after { content:""; position:absolute; top:50%; right:-18px; width:10px; height:10px; border-radius:50%; background:var(--red); transform:translateY(-50%); }

/* 13 · Before/after */
.shift-scene { display:grid; grid-template-columns:1fr 90px 1fr; gap:3%; align-items:center; height:100%; }
.shift-column { align-self:stretch; padding:16px 0; border-block:1px solid var(--rule); }
.shift-column h3 { margin:0 0 13px; color:var(--red); font-size:10px; letter-spacing:.15em; text-transform:uppercase; }
.shift-item { padding:9px 0; border-bottom:1px solid var(--rule); color:var(--muted); font-size:clamp(10px,.82vw,13px); animation:shift-order 6.5s var(--ease) infinite; }
.shift-column.today .shift-item:nth-child(2) { transform:translateX(10px); }
.shift-column.today .shift-item:nth-child(3) { transform:translateX(-7px); }
.shift-column.structured .shift-item { color:var(--ink); }
.shift-column.structured .shift-item:nth-child(2) { animation-delay:1s; }
.shift-column.structured .shift-item:nth-child(3) { animation-delay:2s; }
.shift-column.structured .shift-item:nth-child(4) { animation-delay:3s; }
.shift-column.structured .shift-item:nth-child(5) { animation-delay:4s; }
.shift-transform { position:relative; height:70%; display:grid; place-items:center; }
.shift-transform::before { content:""; position:absolute; top:0; bottom:0; left:50%; width:1px; background:var(--rule); }
.shift-transform span { z-index:2; width:58px; aspect-ratio:1; display:grid; place-items:center; border-radius:50%; background:var(--red); color:white; font-size:8px; font-weight:800; letter-spacing:.08em; transform:rotate(-90deg); animation:core-pulse 5s ease-in-out infinite; }

/* 14 · Outcomes */
.outcome-scene { display:grid; grid-template-columns:repeat(3,1fr); gap:0; height:100%; align-items:center; }
.outcome { position:relative; min-height:230px; padding:24px 28px 20px 0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); }
.outcome+.outcome { padding-left:28px; border-left:1px solid var(--rule); }
.outcome-no { color:var(--red); font-size:clamp(40px,5vw,83px); line-height:.85; font-weight:850; letter-spacing:-.07em; opacity:.9; }
.outcome h3 { margin:21px 0 8px; font-size:clamp(15px,1.35vw,22px); }
.outcome p { margin:0; color:var(--muted); font-size:clamp(10px,.8vw,13px); line-height:1.45; }
.outcome::after { content:""; position:absolute; left:0; right:100%; bottom:-1px; height:2px; background:var(--red); animation:outcome-underline 7.5s var(--ease) infinite; }
.outcome:nth-child(2)::after { animation-delay:2.5s; }
.outcome:nth-child(3)::after { animation-delay:5s; }

/* 15 · Reveal */
.reveal-scene { max-width:900px; margin:auto 0; }
.reveal-quote { margin:0; font-size:clamp(24px,2.7vw,45px); line-height:1.17; font-weight:750; letter-spacing:-.05em; text-wrap:balance; }
.reveal-rule { position:relative; height:1px; margin:clamp(22px,2.4vw,38px) 0; background:var(--rule-light); overflow:hidden; }
.reveal-rule::after { content:""; position:absolute; inset:0 100% 0 0; background:white; animation:reveal-line 5.8s var(--ease) infinite; }
.reveal-close { margin:0; font-size:clamp(20px,2.1vw,35px); font-weight:800; letter-spacing:-.04em; }
.reveal-word { position:absolute; right:-2%; bottom:-8%; color:rgba(255,255,255,.07); font-size:clamp(90px,17vw,270px); line-height:.8; font-weight:850; letter-spacing:-.09em; text-transform:uppercase; animation:ghost-shift 8s ease-in-out infinite; }

/* 16–19 · Prospects */
.prospect-scene { display:grid; grid-template-columns:1fr 1fr; gap:clamp(15px,2vw,28px); height:100%; }
.prospect-card { position:relative; display:flex; flex-direction:column; min-width:0; padding:clamp(15px,1.65vw,27px); border:1px solid var(--rule); border-radius:20px; background:rgba(255,255,255,.38); color:var(--ink); text-align:left; cursor:pointer; overflow:hidden; transition:transform .28s var(--ease),border-color .28s,background .28s; }
.tone-dark .prospect-card { border-color:var(--rule-light); background:rgba(255,255,255,.055); color:white; }
.prospect-card:hover { transform:translateY(-4px); border-color:var(--red); background:var(--paper-light); }
.tone-dark .prospect-card:hover { background:rgba(255,255,255,.09); border-color:white; }
.prospect-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--red); transform:scaleY(.08); transform-origin:top; animation:prospect-scan 7s var(--ease) infinite; }
.prospect-card:nth-child(2)::before { animation-delay:3.5s; }
.prospect-number { color:var(--red); font-size:clamp(8px,.68vw,11px); font-weight:800; letter-spacing:.14em; }
.tone-dark .prospect-number { color:#ff777c; }
.prospect-card h3 { margin:10px 0 7px; font-size:clamp(17px,1.55vw,26px); line-height:1.12; letter-spacing:-.045em; }
.prospect-card>p { margin:0; color:var(--muted); font-size:clamp(9px,.74vw,12px); line-height:1.45; }
.tone-dark .prospect-card>p { color:rgba(255,255,255,.65); }
.causal-flow { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px; margin-top:auto; padding-top:15px; }
.causal-flow span { color:var(--muted); font-size:clamp(7px,.58vw,9px); font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
.tone-dark .causal-flow span { color:rgba(255,255,255,.6); }
.flow-line { position:relative; height:1px; background:var(--rule); overflow:visible; }
.tone-dark .flow-line { background:var(--rule-light); }
.flow-line i { position:absolute; top:-3px; left:0; width:7px; height:7px; border-radius:50%; background:var(--red); animation:signal-travel 3.8s var(--ease) infinite; }
.prospect-card:nth-child(2) .flow-line i { animation-delay:1.9s; }
.explore { margin-top:13px; color:var(--red); font-size:8px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
.tone-dark .explore { color:#ff777c; }
.prospect-takeaway { margin-top:13px; padding-top:11px; border-top:1px solid var(--rule); font-size:clamp(12px,1.05vw,17px); font-weight:750; }
.tone-dark .prospect-takeaway { border-color:var(--rule-light); }

/* 20 · Conclusion */
.conclusion-scene { display:grid; grid-template-columns:.82fr 1.18fr; gap:7%; height:100%; align-items:center; }
.final-lockup h2 { margin:0; font-size:clamp(48px,6.7vw,112px); line-height:.82; font-weight:850; letter-spacing:-.085em; }
.final-lockup p { margin:14px 0 0; font-size:clamp(22px,2.45vw,42px); font-weight:750; letter-spacing:-.05em; }
.final-cycle { display:grid; gap:0; border-block:1px solid var(--rule-light); }
.final-step { position:relative; display:grid; grid-template-columns:84px 1fr; gap:18px; align-items:center; padding:13px 0; border-bottom:1px solid var(--rule-light); }
.final-step:last-child { border-bottom:0; }
.final-step b { font-size:9px; letter-spacing:.14em; text-transform:uppercase; }
.final-step span { font-size:clamp(13px,1.18vw,19px); font-weight:750; }
.final-step::after { content:""; position:absolute; left:0; bottom:-1px; width:0; height:2px; background:white; animation:final-sequence 7.2s var(--ease) infinite; }
.final-step:nth-child(2)::after { animation-delay:2.4s; }
.final-step:nth-child(3)::after { animation-delay:4.8s; }
.audience-row { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:22px; }
.audience-row div { padding-left:11px; border-left:1px solid white; }
.audience-row b { display:block; font-size:8px; letter-spacing:.13em; text-transform:uppercase; }
.audience-row span { display:block; margin-top:5px; color:rgba(255,255,255,.67); font-size:clamp(8px,.65vw,10px); line-height:1.35; }

/* Overlays */
.overlay { position:fixed; z-index:60; inset:0; display:none; overflow:auto; padding:clamp(22px,4vw,60px); background:rgba(21,21,21,.96); backdrop-filter:blur(18px); }
.overlay.open { display:block; animation:overlay-in .35s var(--ease) both; }
.overlay-head { max-width:1240px; margin:0 auto 28px; display:flex; justify-content:space-between; align-items:flex-start; gap:20px; color:white; }
.overlay-head h2 { margin:5px 0 0; font-size:clamp(28px,3vw,46px); letter-spacing:-.05em; }
.overlay-kicker { margin:0; color:#ff777c; font-size:10px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
.close { flex:none; width:44px; height:44px; border:0; border-radius:50%; background:var(--red); color:white; font-size:24px; cursor:pointer; }
.overview-grid { max-width:1240px; margin:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:12px; }
.thumb { min-height:148px; padding:18px; display:flex; flex-direction:column; justify-content:space-between; border:1px solid rgba(255,255,255,.18); border-radius:14px; background:var(--paper); color:var(--ink); text-align:left; cursor:pointer; transition:transform .25s var(--ease),border-color .25s; }
.thumb:hover { transform:translateY(-3px); border-color:var(--red); }
.thumb span,.thumb small { color:var(--red); font-size:9px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
.thumb strong { font-size:17px; line-height:1.18; letter-spacing:-.035em; }
.detail-shell { position:relative; max-width:920px; margin:3vh auto; padding:clamp(30px,5vw,68px); border-radius:22px; background:var(--paper); color:var(--ink); box-shadow:0 30px 90px rgba(0,0,0,.45); }
.detail-close { position:absolute; top:22px; right:22px; }
.detail-kicker { color:var(--red); font-size:10px; font-weight:800; letter-spacing:.17em; text-transform:uppercase; }
.detail-shell h2 { max-width:760px; margin:15px 0; padding-right:40px; font-size:clamp(30px,3vw,48px); line-height:1.04; letter-spacing:-.055em; }
.detail-lede { max-width:720px; color:var(--muted); font-size:17px; line-height:1.48; }
.detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:30px; }
.detail-grid section { padding-top:13px; border-top:1px solid var(--rule); }
.detail-grid h3 { margin:0 0 7px; color:var(--red); font-size:9px; letter-spacing:.14em; text-transform:uppercase; }
.detail-grid p { margin:0; font-size:14px; line-height:1.5; }
.detail-fine { margin:28px 0 0; color:var(--muted); font-size:11px; line-height:1.45; }

/* Motion */
@keyframes scene-enter { from { opacity:0; transform:translateX(28px) rotateY(-1.5deg); } to { opacity:1; transform:none; } }
@keyframes overlay-in { from { opacity:0; } to { opacity:1; } }
@keyframes ring-breathe { 50% { transform:scale(1.035); opacity:.76; } }
@keyframes orbit-breathe { 50% { transform:scale(.965); opacity:.7; } }
@keyframes core-pulse { 0%,70%,100% { transform:scale(1); } 18%,34% { transform:scale(1.06); } }
@keyframes node-pulse { 0%,76%,100% { transform:scale(1); box-shadow:0 0 0 0 rgba(215,25,32,.22); } 18% { transform:scale(1.12); box-shadow:0 0 0 14px rgba(215,25,32,0); } }
@keyframes rail-travel { 0% { top:-20%; opacity:0; } 15% { opacity:1; } 78% { opacity:1; } 100% { top:96%; opacity:0; } }
@keyframes capability-align { 0%,72%,100% { transform:translateY(0); border-color:var(--rule); } 18%,36% { transform:translateY(-5px); border-color:rgba(215,25,32,.62); } }
@keyframes ai-connect { 0%,100% { box-shadow:0 0 0 0 rgba(215,25,32,.15); } 40% { box-shadow:0 0 0 15px rgba(215,25,32,0); } }
@keyframes lane-converge { 0%,100% { transform:scaleX(.25); opacity:.25; } 38%,62% { transform:scaleX(1); opacity:1; } }
@keyframes vertical-scan { 0% { top:-34%; } 100% { top:110%; } }
@keyframes node-signal { 0%,68%,100% { border-color:var(--rule); color:var(--ink); } 16%,34% { border-color:var(--red); color:var(--red); } }
@keyframes journey-travel { 0% { left:0; opacity:0; } 8% { opacity:1; } 88% { left:calc(100% - 7px); opacity:1; } 100% { left:calc(100% - 7px); opacity:0; } }
@keyframes stage-focus { 0%,72%,100% { transform:translateY(0); } 15%,30% { transform:translateY(-5px); } }
@keyframes link-flow { from { transform:translateX(-100%); } to { transform:translateX(100%); } }
@keyframes bridge-grow { 0%,100% { transform:scaleX(.05); opacity:.2; } 35%,68% { transform:scaleX(1); opacity:1; } }
@keyframes bridge-scan { 0%,100% { transform:scaleX(.15); opacity:.2; } 50% { transform:scaleX(1); opacity:1; } }
@keyframes role-travel { 0% { left:4%; opacity:0; } 10% { opacity:1; } 90% { opacity:1; } 100% { left:94%; opacity:0; } }
@keyframes evidence-focus { 0%,72%,100% { border-color:var(--rule); transform:translateY(0); } 16%,34% { border-color:var(--red); transform:translateY(-6px); } }
@keyframes shift-order { 0%,70%,100% { border-color:var(--rule); } 18%,35% { border-color:var(--red); } }
@keyframes outcome-underline { 0%,100% { right:100%; } 18%,36% { right:0; } 54% { right:0; left:100%; } 55% { left:0; right:100%; } }
@keyframes reveal-line { 0%,100% { right:100%; } 35%,70% { right:0; } }
@keyframes ghost-shift { 50% { transform:translateX(-2.5%); } }
@keyframes prospect-scan { 0%,100% { transform:scaleY(.08); } 28%,54% { transform:scaleY(1); } }
@keyframes signal-travel { 0% { left:0; opacity:0; } 12% { opacity:1; } 82% { left:calc(100% - 7px); opacity:1; } 100% { left:calc(100% - 7px); opacity:0; } }
@keyframes final-sequence { 0%,100% { width:0; } 18%,36% { width:100%; } 52% { width:0; left:100%; } 53% { left:0; } }

::view-transition-old(root) { animation:.32s var(--ease) both vt-old; }
::view-transition-new(root) { animation:.55s var(--ease) both vt-new; }
@keyframes vt-old { to { opacity:0; transform:translateX(-18px); } }
@keyframes vt-new { from { opacity:0; transform:translateX(26px); } }

.motion-paused *, .motion-paused *::before, .motion-paused *::after,
.tab-hidden *, .tab-hidden *::before, .tab-hidden *::after { animation-play-state:paused !important; }

@media (max-width:900px) {
  :root { --ui-h:54px; }
  .topbar,.bottom { padding-inline:18px; }
  .slide { width:min(100%,calc((100dvh - 130px)*1.77778)); max-height:calc(100dvh - 130px); }
  .slide-canvas { padding:3.5% 5.8%; }
  .signal-rail { left:2.6%; }
  .title { font-size:clamp(22px,4.25vw,39px); }
  .subtitle { font-size:clamp(9px,1.45vw,13px); }
  .motion-toggle { min-width:78px; }
  .capability-field,.network-map,.ecosystem-map { min-height:220px; }
  .prospect-card { border-radius:14px; }
}

@media (max-width:600px) {
  :root { --ui-h:54px; }
  html,body { overflow:auto; }
  .app { min-height:100dvh; }
  .toplabel,.brand small,.hint { display:none; }
  .top-actions { gap:5px; }
  .control { min-width:40px; height:40px; }
  .motion-toggle { min-width:55px; padding-inline:8px; font-size:8px; }
  .stage { align-items:start; overflow:auto; padding:9px; }
  .slide { width:100%; max-height:none; min-height:calc(100dvh - 127px); aspect-ratio:auto; container-type:normal; }
  .slide-canvas { min-height:calc(100dvh - 127px); padding:28px 24px; }
  .signal-rail,.slide::after { display:none; }
  .scene-header { max-width:100%; }
  .title { font-size:clamp(29px,8vw,42px); line-height:1.02; }
  .subtitle { font-size:13px; }
  .scene-body { margin-top:24px; justify-content:flex-start; }
  .scene-footer { margin-top:24px; font-size:8px; }
  .chapter { min-width:0; }
  .cover-grid,.capability-scene,.ecosystem-scene,.network-scene,.role-scene,.boundary-scene,.conclusion-scene { grid-template-columns:1fr; }
  .cover-title { font-size:clamp(58px,17vw,90px); }
  .cover-orbit { display:none; }
  .cover-outcomes { gap:8px; }
  .cover-copy { font-size:15px; }
  .capability-field { grid-template-columns:repeat(2,1fr); min-height:0; }
  .capability.ai { grid-column:1/3; }
  .overlap-scene { grid-template-columns:1fr; }
  .overlap-core { width:100px; justify-self:center; }
  .service-lane::after { display:none; }
  .consequence-scene { grid-template-columns:1fr; gap:18px; }
  .consequence-divider { display:none; }
  .consequence-word { font-size:64px; }
  .ecosystem-map,.network-map { min-height:300px; }
  .journey-track { grid-template-columns:1fr 1fr; gap:9px; }
  .journey-track::before,.journey-track::after { display:none; }
  .journey-step { padding:14px; border:1px solid var(--rule); }
  .journey-step::before { display:none; }
  .gap-scene { grid-template-columns:1fr; }
  .gap-space { height:90px; }
  .role-process { grid-template-columns:1fr 1fr; gap:10px; }
  .role-process::before,.role-process::after { display:none; }
  .role-step { padding:14px; border:1px solid var(--rule); }
  .role-step::before { display:none; }
  .boundary-bridge { min-height:210px; }
  .evidence-scene { grid-template-columns:1fr 1fr; gap:9px; }
  .evidence-scene::before,.evidence-item::after { display:none; }
  .evidence-item { padding:14px; border:1px solid var(--rule); }
  .shift-scene { grid-template-columns:1fr; }
  .shift-transform { height:64px; }
  .shift-transform::before { top:50%; bottom:auto; left:0; right:0; width:auto; height:1px; }
  .shift-transform span { transform:none; }
  .outcome-scene { grid-template-columns:1fr; gap:9px; }
  .outcome { min-height:0; padding:16px 0; }
  .outcome+.outcome { padding-left:0; border-left:0; }
  .outcome-no { font-size:48px; }
  .prospect-scene { grid-template-columns:1fr; }
  .prospect-card { min-height:230px; }
  .audience-row { grid-template-columns:1fr; }
  .detail-grid { grid-template-columns:1fr; }
}

@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}

/* Invisible Banking rebuild: City Bank Next Chapter visual system. */
:root{--paper:#f4f0e8;--paper-light:#fcfaf6;--ink:#151515;--muted:#6d6964;--red:#d71920;--red-deep:#b30d15;--rule:rgba(21,21,21,.16);--card:rgba(255,255,255,.48);--slide-left:clamp(72px,10vw,170px);--slide-right:clamp(30px,6vw,100px)}
html,body{overflow:hidden;background:var(--paper)}
body{-webkit-font-smoothing:antialiased}
.app{height:100dvh;min-height:0;display:block;background:var(--paper)}
.topbar{position:fixed;z-index:35;inset:0 0 auto;height:64px;display:grid;grid-template-columns:1fr auto 1fr;padding:0 clamp(28px,6vw,100px);border-bottom:1px solid var(--rule);background:rgba(244,240,232,.91);backdrop-filter:blur(15px)}
.brand{font-size:13px;letter-spacing:.17em}.brand-rule{width:5px;height:25px}.brand small{display:none}
.presentation-title{text-align:center;text-transform:uppercase}.presentation-title strong{display:block;font-size:9px;letter-spacing:.16em}.presentation-title span{display:block;margin-top:3px;color:var(--muted);font-size:8px;letter-spacing:.11em}
.chapter-label{justify-self:end;color:var(--red);font-size:9px;font-weight:800;letter-spacing:.17em;text-transform:uppercase}
.story-rail{position:fixed;z-index:36;left:22px;top:50%;display:flex;flex-direction:column;gap:13px;transform:translateY(-50%)}
.story-rail:before{content:"";position:absolute;z-index:-1;left:10px;top:11px;bottom:11px;width:1px;background:var(--rule)}
.story-rail button{width:120px;padding:0;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--muted);text-align:left;cursor:pointer}
.story-rail span{flex:none;width:21px;height:21px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:50%;background:var(--paper);font-size:7px;font-weight:800;transition:.2s ease}
.story-rail b{opacity:0;transform:translateX(-4px);font-size:8px;letter-spacing:.09em;text-transform:uppercase;transition:.2s ease}
.story-rail button:hover b,.story-rail button.is-active b{opacity:1;transform:none}.story-rail button.is-active span{border-color:var(--red);background:var(--red);color:white}
.stage{position:absolute;inset:0;padding:0;display:block;perspective:none;overflow:hidden}
.slide{width:100%;height:100dvh;max-height:none;aspect-ratio:auto;border:0;box-shadow:none;container-type:normal;overflow:hidden}
.slide.tone-paper,.slide.cover.tone-dark{background:var(--paper);color:var(--ink)}
.slide.tone-dark{background:var(--ink);color:#fff;box-shadow:none;border:0}.slide.tone-red{background:var(--red);color:#fff;box-shadow:none;border:0}
.slide::after,.signal-rail{display:none!important}
.slide-canvas,.cover .slide-canvas{height:100%;padding:clamp(91px,12vh,130px) var(--slide-right) clamp(102px,13vh,139px) var(--slide-left)}
.scene-header{max-width:100%}.eyebrow{gap:14px;font-size:10px;letter-spacing:.2em}.eyebrow::before{width:34px}
.title{max-width:1100px;margin:19px 0 0;font-size:clamp(39px,4.65vw,76px);line-height:.94;font-weight:800;letter-spacing:-.058em}
.subtitle{max-width:880px;margin:18px 0 0;font-size:clamp(14px,1.18vw,19px);line-height:1.4}
.scene-body{margin-top:clamp(22px,4vh,44px)}.scene-footer{font-size:9px;letter-spacing:.12em;padding-top:16px}
.controls{position:fixed;z-index:40;left:50%;bottom:max(19px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:7px;padding:7px;border:1px solid rgba(21,21,21,.12);border-radius:999px;background:rgba(255,255,255,.91);box-shadow:0 12px 40px rgba(0,0,0,.11);backdrop-filter:blur(16px);transform:translateX(-50%)}
.controls .nav,.controls .control{width:38px;min-width:38px;height:38px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--ink);box-shadow:none;font-size:17px}

.controls .nav:disabled{opacity:.25;background:transparent;color:var(--ink)}
.controls .navgroup{gap:4px}.controls .counter{min-width:61px;font-size:10px;letter-spacing:.1em}
.controls .progress-group{width:215px;padding:0 7px;display:grid;gap:8px}.controls .progress{position:static;height:2px;background:var(--rule);border-radius:2px;overflow:hidden}.controls .progress span{background:var(--red)}
.slide-dots{display:flex;justify-content:center;gap:4px}.slide-dots button{width:5px;height:5px;padding:0;border:0;border-radius:50%;background:rgba(21,21,21,.21);cursor:pointer}.slide-dots button.is-active{background:var(--red);transform:scale(1.45)}
.controls .motion-toggle{width:auto;min-width:0;padding:0 11px;border-left:1px solid var(--rule);border-radius:0;font-size:8px;letter-spacing:.08em;white-space:nowrap}.controls .motion-toggle:hover{border-radius:20px}
.controls .icon-control svg{width:17px;height:17px}
.key-hint{position:fixed;z-index:30;right:clamp(25px,6vw,100px);bottom:34px;color:var(--muted);font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.slide.tone-dark~.key-hint{color:#fff}
/* Motion is intentional and finite: no decorative perpetual loops. */
.slide,.slide *, .slide::before,.slide::after,.slide *::before,.slide *::after{animation:none!important}
::view-transition-old(root),::view-transition-new(root){animation:none!important}

/* 01 — one glowing hub, four smaller satellites, then the connections. */
.cover-grid{grid-template-columns:1.08fr .92fr;gap:2%}.cover-title{font-size:clamp(68px,9.6vw,156px);line-height:.77;color:var(--ink)}.cover-title span{color:var(--red)}.cover-copy{color:var(--muted);font-size:clamp(16px,1.4vw,22px)}
.cover-outcomes{margin-top:clamp(25px,3vw,42px)}.cover-outcome{border-color:var(--red)}.cover-outcome span{color:var(--muted)}.cover .scene-footer{border-color:var(--rule);color:var(--muted)}
.cover-orbit{width:min(39vw,500px);aspect-ratio:1}.cover-orbit .ring{inset:5%;border-color:rgba(215,25,32,.15)}.cover-orbit .ring:nth-child(2){inset:20%}.cover-orbit .ring:nth-child(3){inset:36%}
.cover-orbit .core{inset:36%;z-index:3;background:radial-gradient(circle at 35% 30%,#ff8587 0,#e62931 35%,#b50b13 100%);box-shadow:0 0 34px rgba(215,25,32,.42),0 0 90px rgba(215,25,32,.17)}
.cover-orbit .orbit-dot{z-index:3;background:var(--red);box-shadow:0 0 0 8px rgba(215,25,32,.11),0 0 25px rgba(215,25,32,.28)}
.cover-orbit .orbit-dot:nth-of-type(5){left:19%;top:19%;width:25px;transform:translate(-50%,-50%)}.cover-orbit .orbit-dot:nth-of-type(6){left:85%;top:25%;width:17px;right:auto;transform:translate(-50%,-50%)}.cover-orbit .orbit-dot:nth-of-type(7){left:80%;top:81%;width:30px;bottom:auto;transform:translate(-50%,-50%)}.cover-orbit .orbit-dot:nth-of-type(8){left:18%;top:78%;width:13px;bottom:auto;transform:translate(-50%,-50%)}
.orb-links{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.orb-links path{fill:none;stroke:var(--red);stroke-width:1.6;stroke-dasharray:320;stroke-dashoffset:320;opacity:.75}
body:not(.motion-paused):not(.tab-hidden) .cover-orbit .orb-links path{animation:draw-orb .72s ease-out forwards!important}.orb-links path:nth-child(1){animation-delay:.2s!important}.orb-links path:nth-child(2){animation-delay:.45s!important}.orb-links path:nth-child(3){animation-delay:.7s!important}.orb-links path:nth-child(4){animation-delay:.95s!important}
@keyframes draw-orb{to{stroke-dashoffset:0}}

/* 02 — simultaneous joins, followed by a shared colour state. */
.capability-scene{grid-template-columns:.7fr 1.3fr;gap:5%}.advantage-line{font-size:clamp(27px,2.8vw,46px)}.quiet{max-width:410px;font-size:15px;line-height:1.45}
.capability-field{min-height:270px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-content:center}.capability-field::before{display:none}
.capability{min-height:116px;padding:22px 11px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:20px;background:var(--card);font-size:clamp(12px,1.05vw,17px);line-height:1.1;box-shadow:0 12px 28px rgba(21,21,21,.035)}
.capability:nth-child(-n+3)::after{content:"";position:absolute;z-index:1;left:100%;top:50%;width:12px;height:2px;background:var(--red);transform:scaleX(0);transform-origin:left}
.capability-bridge{display:none}.capability-result{grid-column:1/-1;padding:13px 16px;border-left:3px solid var(--red);color:var(--muted);font-size:13px}
body:not(.motion-paused):not(.tab-hidden) .capability:nth-child(-n+3)::after{animation:connect-boxes .75s .25s ease-out forwards!important}
body:not(.motion-paused):not(.tab-hidden) .capability{animation:connected-box 1.8s ease-out forwards!important}
@keyframes connect-boxes{to{transform:scaleX(1)}}@keyframes connected-box{0%,57%{border-color:var(--rule);background:var(--card);color:var(--ink)}100%{border-color:var(--red);background:var(--red);color:white}}

/* 03 — distinct service cards and a clearly isolated shared capability. */
.overlap-scene{grid-template-columns:1fr .64fr 1fr;gap:12px;align-items:stretch}
.service-lane{position:relative;z-index:1;padding:26px;border:1px solid var(--rule);border-radius:24px;background:var(--card)}.service-lane::after{display:none}.service-lane h3{font-size:clamp(23px,2.2vw,34px)}.service-lane ul{font-size:clamp(12px,1vw,16px);line-height:1.75}.service-lane li{padding:4px 0}.service-lane .shared-feature{color:var(--red);font-weight:800}
.overlap-core{position:relative;z-index:3;width:calc(100% + 48px);min-height:235px;margin-inline:-24px;aspect-ratio:auto;display:flex;flex-direction:column;justify-content:center;gap:17px;padding:22px;border-radius:24px;background:var(--red);font-size:12px;letter-spacing:0;line-height:1.35;box-shadow:0 14px 38px rgba(215,25,32,.19)}.overlap-core b{font-size:10px;letter-spacing:.16em}.overlap-core span{font-size:clamp(16px,1.45vw,23px);font-weight:800;letter-spacing:-.04em}.overlap-core small{color:rgba(255,255,255,.78);font-size:11px;text-transform:none}
body:not(.motion-paused):not(.tab-hidden) .overlap-core{animation:shared-reveal .7s .65s ease-out both!important}
body:not(.motion-paused):not(.tab-hidden) .service-lane.left{animation:service-left .8s .2s ease-out both!important}
body:not(.motion-paused):not(.tab-hidden) .service-lane.right{animation:service-right .8s .2s ease-out both!important}
body:not(.motion-paused):not(.tab-hidden) .shared-feature{animation:feature-converge 1s .25s ease-out both!important}
@keyframes shared-reveal{from{opacity:.15;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes service-left{from{transform:translateX(-18px)}to{transform:translateX(10px)}}@keyframes service-right{from{transform:translateX(18px)}to{transform:translateX(-10px)}}@keyframes feature-converge{from{opacity:1}to{opacity:.45}}

/* 04 — stronger hierarchy, not more motion. */
.consequence-scene{grid-template-columns:1fr 60px 1fr;gap:12px}.consequence{min-height:290px;padding:27px;justify-content:flex-start;border:1px solid var(--rule);border-radius:24px;background:var(--card)}
.consequence-no{color:var(--red);font-size:10px;font-weight:800;letter-spacing:.15em}.consequence-word{margin-top:auto;font-size:clamp(50px,6.4vw,102px)}.consequence h3{margin:20px 0 6px;font-size:17px}.consequence p{max-width:400px;font-size:13px}.consequence-divider{height:auto;display:grid;place-items:center;background:none;color:var(--red);font-size:34px;font-weight:300}
.consequence-divider::after{display:none}

/* 05 — connected tablet cards originate behind the customer need. */
.ecosystem-scene{grid-template-columns:.58fr 1.42fr;gap:4%}.ecosystem-copy{font-size:clamp(27px,2.9vw,48px)}.ecosystem-map{min-height:340px}.ecosystem-map::before,.ecosystem-map::after{display:none}
.ecosystem-map svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.ecosystem-map svg path{fill:none;stroke:rgba(215,25,32,.55);stroke-width:1.4;stroke-dasharray:1250;stroke-dashoffset:1250}
.ecosystem-core{z-index:5;width:152px;height:152px;aspect-ratio:auto;border-radius:50%;box-shadow:0 10px 34px rgba(215,25,32,.25);font-size:20px}
.ecosystem-node{min-width:135px;min-height:57px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:18px;background:var(--paper-light);box-shadow:0 10px 30px rgba(21,21,21,.07);font-size:10px}
.ecosystem-node:nth-of-type(2){top:0;left:38%;--dx:0px;--dy:145px}.ecosystem-node:nth-of-type(3){top:41%;right:0;--dx:-210px;--dy:0px}.ecosystem-node:nth-of-type(4){bottom:0;left:38%;--dx:0px;--dy:-145px}.ecosystem-node:nth-of-type(5){top:41%;left:0;--dx:210px;--dy:0px}
body:not(.motion-paused):not(.tab-hidden) .ecosystem-map svg path{animation:ecosystem-draw 1.5s .5s ease-out forwards!important}
body:not(.motion-paused):not(.tab-hidden) .ecosystem-node{animation:tablet-emerge .9s ease-out both!important}.ecosystem-node:nth-of-type(2){animation-delay:.05s!important}.ecosystem-node:nth-of-type(3){animation-delay:.2s!important}.ecosystem-node:nth-of-type(4){animation-delay:.35s!important}.ecosystem-node:nth-of-type(5){animation-delay:.5s!important}
@keyframes ecosystem-draw{to{stroke-dashoffset:0}}@keyframes tablet-emerge{from{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.55)}to{opacity:1;transform:none}}

/* 06, 07, 10 — line pauses at each station and the station fills. */
.journey-scene{justify-content:center}.journey-track{gap:7px}.journey-track::before{top:17px;height:2px;background:var(--rule)}.journey-track::after{top:17px;width:0;height:2px;border-radius:0;background:var(--red)}
.journey-step{padding:54px 14px 14px 0}.journey-step::before{top:11px;z-index:2;width:14px;height:14px;background:var(--paper)}.journey-step h3{font-size:clamp(22px,2.1vw,34px)}.journey-step p{max-width:210px;font-size:clamp(12px,1vw,15px)}.journey-close{font-size:clamp(18px,1.6vw,26px)}
body:not(.motion-paused):not(.tab-hidden) .journey-track::after{animation:journey-stops 5.3s ease-in-out forwards!important}
body:not(.motion-paused):not(.tab-hidden) .journey-step::before,body:not(.motion-paused):not(.tab-hidden) .role-step::before{animation:station-fill 5.3s linear forwards!important}
.journey-step:nth-child(1)::before,.role-step:nth-child(1)::before{--station:0}.journey-step:nth-child(2)::before,.role-step:nth-child(2)::before{--station:1}.journey-step:nth-child(3)::before,.role-step:nth-child(3)::before{--station:2}.journey-step:nth-child(4)::before,.role-step:nth-child(4)::before{--station:3}
@keyframes journey-stops{0%,14%{width:0}22%,37%{width:33.333%}45%,60%{width:66.666%}68%,100%{width:100%}}
@keyframes station-fill{0%,14%{background:var(--paper);box-shadow:none}22%,100%{background:var(--red);box-shadow:0 0 0 5px rgba(215,25,32,.13)}}
/* Per-stop delays keep the fill in step with the paused line. */
.journey-step:nth-child(1)::before,.role-step:nth-child(1)::before{animation-delay:-.75s!important}.journey-step:nth-child(2)::before,.role-step:nth-child(2)::before{animation-delay:.35s!important}.journey-step:nth-child(3)::before,.role-step:nth-child(3)::before{animation-delay:1.65s!important}.journey-step:nth-child(4)::before,.role-step:nth-child(4)::before{animation-delay:2.95s!important}

/* 08 — relationship matrix. */
.network-scene{grid-template-columns:.38fr .62fr;gap:4%}.network-lead{font-size:clamp(25px,2.7vw,43px)}
.network-matrix{display:grid;grid-template-columns:1.05fr repeat(3,1fr);border:1px solid var(--rule);border-radius:22px;overflow:hidden;background:var(--paper-light);box-shadow:0 12px 32px rgba(21,21,21,.04)}
.network-matrix>div{min-height:61px;padding:14px 12px;display:flex;align-items:center;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:clamp(10px,.85vw,13px);line-height:1.25}.network-matrix>div:nth-child(4n){border-right:0}.network-matrix>div:nth-last-child(-n+4){border-bottom:0}
.network-matrix .matrix-head,.network-matrix .matrix-corner{background:var(--ink);color:white;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.network-matrix .matrix-corner{background:var(--red)}.network-matrix .matrix-rowhead{color:var(--red);font-weight:800}

/* 09 — a visible, animated gap and a readable label at all sizes. */
.gap-scene{grid-template-columns:1fr .56fr 1fr;gap:3%}.mandate-row{font-size:clamp(11px,.9vw,14px)}.mandate-row b{font-size:10px}
.gap-space{height:82%;min-height:230px;border:1px dashed rgba(215,25,32,.4);border-radius:22px;background:linear-gradient(90deg,rgba(215,25,32,.025),rgba(215,25,32,.11),rgba(215,25,32,.025));overflow:visible}
.gap-space::before{left:-6%;right:-6%;height:3px;background:var(--red);transform:scaleX(0);transform-origin:left;z-index:2}
.gap-space::after{content:"";position:absolute;inset:12px;border:1px solid rgba(215,25,32,.14);border-radius:16px}
.gap-bridge{position:absolute;z-index:1;inset:20% 14%;border:1px solid rgba(215,25,32,.32);border-radius:50%;opacity:0}
.gap-label{padding:14px 12px;border:1px solid rgba(215,25,32,.25);border-radius:14px;background:var(--paper-light);font-size:13px;line-height:1.3;box-shadow:0 12px 30px rgba(215,25,32,.11)}
.gap-callout{font-size:clamp(26px,2.55vw,42px)}.gap-callout span{font-size:clamp(12px,1vw,16px)}
body:not(.motion-paused):not(.tab-hidden) .gap-space::before{animation:gap-cross 1.5s .35s ease-out forwards!important}
body:not(.motion-paused):not(.tab-hidden) .gap-bridge{animation:gap-emphasis 1s .8s ease-out forwards!important}
@keyframes gap-cross{0%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}@keyframes gap-emphasis{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}

/* 10 — operational path and the two transformation domains. */
.role-scene{grid-template-columns:1.22fr .78fr;gap:5%}.role-process::before{top:24px;height:2px}.role-process::after{top:24px;left:4%;width:0;height:2px;border-radius:0}
.role-step{padding-top:57px}.role-step::before{top:18px;z-index:2;background:var(--paper)}.role-step b{font-size:clamp(18px,1.5vw,24px)}.role-step span{font-size:clamp(11px,.85vw,14px)}
body:not(.motion-paused):not(.tab-hidden) .role-process::after{animation:journey-stops 5.3s ease-in-out forwards!important}
.role-domains{gap:10px}.role-domain{min-height:122px;padding:15px;border:1px solid var(--rule);border-radius:18px;background:var(--card)}.role-domain b{font-size:10px}.role-domain p{font-size:clamp(11px,.88vw,14px)}
.domain-visual{position:relative;width:100%;height:23px;margin-bottom:10px}.domain-visual i{position:absolute;top:8px;width:16px;height:10px;border-radius:4px;background:var(--red)}.horizontal-visual i:nth-child(1){left:6%}.horizontal-visual i:nth-child(2){left:42%}.horizontal-visual i:nth-child(3){left:80%}.horizontal-visual em{position:absolute;left:7%;right:11%;top:13px;height:1px;background:var(--red)}
.ecosystem-visual i:nth-child(1){left:7%;top:1px}.ecosystem-visual i:nth-child(2){left:45%;top:13px}.ecosystem-visual i:nth-child(3){left:82%;top:1px}.ecosystem-visual em{position:absolute;left:10%;right:12%;top:12px;height:1px;background:var(--red);transform:skewY(8deg)}

/* 11 — explicit opportunity-explorer role, ownership intact. */
.boundary-list{border-top:0}.boundary-row{min-height:48px;padding:11px 0;font-size:clamp(10px,.9vw,14px)}.boundary-bridge::before,.boundary-bridge::after{display:none}.bridge-copy{width:255px;height:255px;aspect-ratio:auto;display:flex;flex-direction:column;gap:14px;justify-content:center;border-radius:50%;font-size:20px;line-height:1.2;box-shadow:0 0 0 18px rgba(215,25,32,.08)}.bridge-copy small{font-size:9px;letter-spacing:.15em}

/* 12 — a substantial, legible portfolio with no bobbing. */
.evidence-scene{height:auto;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:stretch}.evidence-scene::before,.evidence-item::after{display:none}
.evidence-item{min-height:240px;height:auto;padding:23px 20px;border:1px solid var(--rule);border-radius:20px;background:var(--card)}.evidence-item b{font-size:9px}.evidence-item p{margin-top:21px;font-size:clamp(12px,1vw,16px);line-height:1.58;font-weight:650}

/* 13 — the shift travels across the divider and lands on a more systematic model. */
.shift-scene{height:clamp(265px,36vh,320px);grid-template-columns:1fr 90px 1fr;gap:2%}.shift-column{padding:18px;border:1px solid var(--rule);border-radius:22px;background:var(--card)}.shift-column.structured{border-color:rgba(215,25,32,.35);background:rgba(215,25,32,.045)}
.shift-column h3{display:flex;justify-content:space-between;gap:15px;font-size:11px}.shift-column h3 small{color:var(--muted);font-size:9px;letter-spacing:.05em;text-transform:none}.shift-oneliner{min-height:49px;margin:4px 0 9px;font-size:clamp(14px,1.25vw,20px);font-weight:750;line-height:1.2;letter-spacing:-.02em}
.shift-item{padding:8px 0;font-size:clamp(11px,.88vw,14px)}.shift-column.today .shift-item:nth-child(n){transform:none}
.shift-transform{height:auto}.shift-transform::before{left:0;right:0;top:50%;bottom:auto;width:auto;height:2px;background:var(--red)}.shift-transform span{width:66px;height:66px;aspect-ratio:auto;font-size:34px;transform:none;box-shadow:0 0 0 11px var(--paper)}.shift-transform small{position:absolute;top:calc(50% + 43px);color:var(--red);font-size:9px;font-weight:800;letter-spacing:.15em}
body:not(.motion-paused):not(.tab-hidden) .shift-transform span{animation:shift-across 1.1s .25s ease-out both!important}
@keyframes shift-across{from{transform:translateX(-52px);opacity:.3}to{transform:translateX(0);opacity:1}}

/* 14, 15, 16 — outcome, mandate statement, AI prospects bridge. */
.outcome-scene{gap:12px}.outcome{min-height:230px;padding:24px;border:1px solid var(--rule);border-radius:20px;background:var(--card)}.outcome+.outcome{padding-left:24px;border-left:1px solid var(--rule)}.outcome::after{display:none}.outcome p{font-size:clamp(12px,1vw,16px)}
.reveal .title{max-width:760px;font-size:clamp(28px,2.4vw,38px);opacity:.75}.reveal-scene{max-width:1100px}.reveal-quote{font-size:clamp(31px,3.6vw,57px);line-height:1.08}.reveal-close{font-size:clamp(17px,1.7vw,27px);opacity:.72}.reveal-word{opacity:.45}
.section-intro .title{max-width:1050px;font-size:clamp(47px,5.5vw,88px)}.section-intro .title .accent{color:#ff555a}.intro-scene{display:grid;grid-template-columns:.4fr 1fr;gap:5%;align-items:center}.intro-number{color:var(--red);font-size:clamp(150px,20vw,300px);font-weight:900;letter-spacing:-.13em;line-height:.75}.intro-scene p{max-width:600px;font-size:clamp(23px,2.5vw,40px);line-height:1.08;font-weight:750;letter-spacing:-.045em}.intro-path{display:flex;align-items:center;gap:12px;margin-top:27px;color:#fff;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.intro-path i{flex:1;height:1px;background:var(--red)}

/* 17–20 — concise scenarios and benefits, expandable evidence. */
.prospects .title{font-size:clamp(35px,4vw,62px)}.prospects .scene-body{justify-content:center}.prospect-scene{height:clamp(260px,37vh,320px);flex:none;min-height:0;gap:16px}.prospect-card{min-height:0;padding:20px;border-radius:24px;background:var(--card)}.tone-dark .prospect-card{background:rgba(255,255,255,.07)}.prospect-card::before{display:none}.prospect-card:hover{transform:translateY(-2px)}
.prospect-card h3{margin:17px 0;font-size:clamp(23px,2vw,34px)}.prospect-card .prospect-story{display:grid;grid-template-columns:65px 1fr;gap:10px;align-items:start;margin:0 0 10px;color:var(--ink);font-size:clamp(11px,.96vw,15px);line-height:1.38}.tone-dark .prospect-card .prospect-story{color:#fff}.prospect-story b{color:var(--red);font-size:9px;letter-spacing:.12em;text-transform:uppercase}.tone-dark .prospect-story b{color:#ff7f83}.prospect-benefit{opacity:.8}.causal-flow{padding-top:12px}.flow-line i{animation:none!important}.explore{font-size:9px}.prospect-takeaway{font-size:clamp(13px,1.15vw,18px)}

/* 21 — role-led path to the future, with the original audience outcomes. */

  <script>
const slides = [
  {
    chapter:'The vision', tone:'dark', layout:'cover', eyebrow:'', title:'Invisible Banking',
    body:`
      <div class="cover-grid">
        <div>
          <h1 class="cover-title">Invisible<span>Banking.</span></h1>
          <p class="cover-copy">Connecting City Bank around customers and businesses.</p>
          <div class="cover-outcomes">
            <div class="cover-outcome"><b>Customer</b><span>One simple experience.</span></div>
            <div class="cover-outcome"><b>Business</b><span>More value from each relationship.</span></div>
            <div class="cover-outcome"><b>Bank</b><span>One connected institution.</span></div>
          </div>
        </div>
        <div class="cover-orbit" aria-label="Connected capabilities around one central customer need">
          <svg class="orb-links" viewBox="0 0 500 500" preserveAspectRatio="none" aria-hidden="true"><path d="M250 250 L95 98"/><path d="M250 250 L425 126"/><path d="M250 250 L400 405"/><path d="M250 250 L92 390"/></svg>
          <i class="ring"></i><i class="ring"></i><i class="ring"></i><i class="core"></i>
          <i class="orbit-dot"></i><i class="orbit-dot"></i><i class="orbit-dot"></i><i class="orbit-dot"></i>
        </div>
      </div>`,
    foot:'It just works'
  },
  {
    chapter:'The opportunity', tone:'paper', layout:'capabilities', eyebrow:'The starting point',
    title:'City Bank has built the pieces. <span class="accent">The next advantage is connection.</span>',
    subtitle:'Transformation is already in motion. The opportunity is to make these strengths work together across City Bank.',
    body:`
      <div class="capability-scene">
        <div>
          <div class="advantage-line">More value from<br><span>what already exists.</span></div>
          <p class="quiet">The next opportunity is not another platform. AI can make existing capabilities more intelligent, responsive and connected.</p>
        </div>
        <div class="capability-field" aria-label="Connected City Bank capabilities">
          <div class="capability">Citytouch</div><div class="capability">Blink</div><div class="capability">Cards + POS</div><div class="capability">Corporate</div>
          <div class="capability-bridge" aria-hidden="true"><i></i><i></i><i></i></div>
          <div class="capability-result">Shared data, AI and technology make each capability more valuable.</div>
        </div>
      </div>`,
    foot:'Existing capabilities · Connected value'
  },
  {
    chapter:'The opportunity', tone:'paper', layout:'overlap', eyebrow:'A real overlap',
    title:'Today, one customer service can be <span class="accent">built twice.</span>',
    subtitle:'When channels evolve separately, the same capability can appear in more than one place.',
    body:`
      <div class="overlap-scene">
        <section class="service-lane left"><span class="micro">Citytouch</span><h3>Digital self-service</h3><ul><li>EMI conversion</li><li class="shared-feature">Cheque book request</li><li class="shared-feature">Statements</li><li>Payments and cards</li></ul></section>
        <div class="overlap-core"><b>SHARED</b><span>Cheque book request<br>Statements</span><small>One capability. Two routes.</small></div>
        <section class="service-lane right"><span class="micro">CityAssist</span><h3>Assisted service</h3><ul><li>Customer queries</li><li class="shared-feature">Cheque book request</li><li class="shared-feature">Statements</li><li>Assisted resolution</li></ul></section>
      </div>`,
    foot:'Two customer routes · Divided context'
  },
  {
    chapter:'The opportunity', tone:'paper', layout:'consequence', eyebrow:'The business consequence',
    title:'Fragmentation has two costs. <span class="accent">One visible. One hidden.</span>',
    subtitle:'The issue is not only duplication. Useful signals and relationships may also fail to connect to the next business opportunity.',
    body:`

        <section class="consequence"><span class="consequence-no">01 / THE VISIBLE COST</span><div class="consequence-word">Repeat.</div><h3>Repeated effort</h3><p>Teams may design, build and maintain similar capabilities more than once.</p></section>
        <div class="consequence-divider" aria-hidden="true">+</div>
        <section class="consequence"><span class="consequence-no">02 / THE HIDDEN COST</span><div class="consequence-word">Miss.</div><h3>Missed growth</h3><p>POS data, corporate relationships or merchant networks may never connect to the next opportunity.</p></section>
      </div>`,
    foot:'Lost effort · Lost time · Lost potential'
  },
  {
    chapter:'The ecosystem idea', tone:'paper', layout:'ecosystem', eyebrow:'The idea',
    title:'One relationship outside. <span class="accent">Connected capabilities inside.</span>',

    body:`

  {

  {

  {

    subtitle:'Opportunities between businesses do not always have a natural first owner.',
    body:`

  },
  {
    chapter:'The proposed mandate', tone:'paper', layout:'role', eyebrow:'A possible role',
    title:'A bank-wide transformation role can <span class="accent">connect the gaps.</span>',
    subtitle:'Simple by design: find the opportunity, shape it, connect the right owners, then move it into execution.',
    body:`
      <div class="role-scene">
        <div class="role-process">
          <div class="role-step"><b>See</b><span>Across the bank.</span></div>

        </div>
      </div>`,
    foot:'Transformation connects · Businesses own · EPMO governs delivery'
  },
  {
    chapter:'The proposed mandate', tone:'paper', layout:'boundaries', eyebrow:'Clear boundaries',
    title:'The role complements <span class="accent">what already exists.</span>',

    body:`

  {

    body:`

const prospects = {
  finance:{number:'01 / Finance',title:'A living business outlook',summary:'Forecasts update as business and external conditions change.',from:'New signals',to:'Forecast review',kind:'Internal prospect 01 · Finance',lede:'A continuously refreshed view of the business, with changes highlighted for accountable decision-makers.',moment:'Revenue, expenses, deposits, lending, market movements and trends change after the planning snapshot.',response:'Models update projections, show drivers of variance and present options for Finance to review, challenge and act on.',value:'More timely decisions, improved resource deployment and potential profitability gains. Impact requires baseline and pilot measurement.',connections:'Finance + business data + market data + model governance.',guardrail:'Forecasts and recommendations need data quality checks, explainability and human ownership of decisions.'},
  trade:{number:'02 / Trade + Treasury',title:'Intelligence that follows global developments',summary:'A global event prompts a review of affected clients and transactions.',from:'Global event',to:'Exposure review',kind:'Internal prospect 02 · Trade & Treasury',lede:'Global developments can be mapped against affected clients and transactions as conditions change.',moment:'A shipping disruption, tariff change, commodity move or FX shock affects an import corridor.',response:'Potentially affected transactions, cash-flow expectations, finance needs and FX exposures are flagged to Trade, Treasury, Corporate, Credit and relationship managers for review.',value:'Earlier intervention, clearer risk awareness and more relevant client solutions.',connections:'Trade + Treasury + Corporate + Credit + external intelligence.',guardrail:'External signals may be incomplete. Credit, suitability and market decisions remain with authorised teams.'},
  dots:{number:'03 / Cross-bank intelligence',title:'The bank connects its own dots',summary:'Shared clues reveal reusable work and a coordinated proposition.',from:'Shared clue',to:'New proposition',kind:'Internal prospect 03 · Cross-bank intelligence',lede:'Shared intelligence can surface useful relationships between work that would otherwise remain separate.',moment:'A corporate payroll relationship expands while Retail, Cards and savings teams develop related propositions.',response:'A governed capability identifies the overlap, relevant existing solutions, dependencies and possible cross-business proposition for owners to assess.',value:'Potentially less duplication, more cross-sell and greater value from existing capabilities.',connections:'Corporate + Retail + Cards + Data + relevant control functions.',guardrail:'Access must respect need-to-know, customer permissions and product ownership. A shared view is not a licence to share all data.'},
  operations:{number:'04 / Proactive operations',title:'Problems surfaced before they spread',summary:'Demand signals reach accountable owners before capacity becomes a customer issue.',from:'Demand signal',to:'Capacity plan',kind:'Internal prospect 04 · Operations',lede:'Demand signals and operational capacity could inform business decisions before customers feel a bottleneck.',moment:'A lending campaign is expected to create more applications than current processing capacity.',response:'The business, Marketing and Operations receive an early scenario showing capacity options, campaign timing and likely service effects.',value:'Better allocation, steadier execution and fewer avoidable customer issues.',connections:'Business + Marketing + Operations + service and capacity data.',guardrail:'Forecast uncertainty should be visible. Operational decisions remain with accountable owners.'},
  health:{number:'01 / Healthcare',title:'Help arrives when it is needed',summary:'A hospital payment can prompt a permitted benefit check and coordinated claim journey.',from:'Hospital payment',to:'Benefit check',kind:'Customer journey 01 · Healthcare',lede:'The hospital payment could start a coordinated benefit journey, subject to explicit permissions and partner integration.',moment:'A customer is hospitalised and makes a payment.',response:'An eligible insurance benefit is checked. With prior authorisation, verified information and insurer support, a claim can be initiated and status tracked.',value:'Less administrative burden in a difficult moment, and greater value from an eligible benefit.',connections:'Payments + Cards + insurer + hospital + consented coordination.',guardrail:'A payment alone cannot establish hospitalisation or coverage. Insurance, privacy, consent and claim rules must govern the journey.'},
  travel:{number:'02 / Travel',title:'The journey organises itself',summary:'A verified itinerary can connect eligible privileges to saved preferences.',from:'Flight booking',to:'Service arranged',kind:'Customer journey 02 · Travel',lede:'A verified flight purchase could activate eligible services without a separate search and booking process.',moment:'A customer purchases a flight ticket.',response:'Card privileges are checked, and with the customer’s saved preferences and authorisation, meet-and-greet or airport services can be arranged. Changes can trigger updates.',value:'Eligible benefits become easier to use and reinforce the card relationship.',connections:'Cards + airlines + airport and travel partners + preference management.',guardrail:'A card transaction may not contain a verified itinerary. Inventory, eligibility and partner confirmation are essential.'},
  coffee:{number:'03 / Everyday lifestyle',title:'The right benefit, without searching',summary:'A permitted preference can connect an everyday purchase to an eligible benefit.',from:'Usual purchase',to:'Benefit applied',kind:'Customer journey 03 · Everyday lifestyle',lede:'Everyday merchant activity could make benefits more relevant and simpler to redeem.',moment:'A customer regularly buys coffee at a preferred merchant.',response:'With permission, the bank recognises a preference and applies an eligible merchant-funded or loyalty benefit automatically at payment.',value:'A useful customer benefit, more merchant engagement and potentially deeper payment preference.',connections:'Cards + POS + merchant partners + loyalty + consented personalisation.',guardrail:'Preferences should not become intrusive surveillance. Funding, eligibility, consent and fairness need testing.'},
  service:{number:'04 / Proactive service',title:'The bank starts fixing things first',summary:'A transaction mismatch can trigger investigation before a customer raises a request.',from:'Payment mismatch',to:'Case initiated',kind:'Customer journey 04 · Proactive service',lede:'The bank can detect a transaction problem, begin investigation and keep the customer informed.',moment:'A payment appears to fail, but the account is debited.',response:'Payment and settlement records are checked. A recovery or investigation opens where appropriate, with clear customer updates through resolution.',value:'Less chasing, lower uncertainty and more trust in the payment experience.',connections:'Payments + Operations + Service + transaction intelligence.',guardrail:'Transaction states can be ambiguous. The bank must distinguish pending, failed and settled payments before promising resolution.'}
};

  trade:{scenario:'A shipping disruption hits a client’s import corridor. Trade and Treasury see the exposure together.',benefit:'The team can contact the client before the disruption becomes a surprise.'},
